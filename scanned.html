<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSlipper — Scanned</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #28394a;
      --paper: #eef5ee;
      --line: #d9e6de;
      --denim: #5b8fc7;
      --denim-dark: #3f6c9e;
      --green: #4caf7d;
      --green-dark: #379764;
      --red: #e0655b;
      --red-dark: #c94a40;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(1000px 500px at 8% -10%, rgba(143,201,160,0.28), transparent 55%),
                  radial-gradient(900px 500px at 100% 0%, rgba(91,143,199,0.22), transparent 55%),
                  linear-gradient(160deg, #eef5ee 0%, #e3edf6 45%, #dbe8f4 100%);
      min-height: 100vh;
    }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; }
    .brandbar { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brandbar .mark {
      width: 44px; height: 44px; border-radius: 50%; background: var(--denim);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-family: 'Anton', sans-serif; font-size: 19px; overflow: hidden; flex-shrink: 0;
    }
    .brandbar .mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .brandbar h1 { font-family: 'Anton', sans-serif; letter-spacing: .4px; font-size: 20px; margin: 0; }
    .brandbar .sub { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #6b7280; margin-top: 1px; }
    .lookup {
      background: #fff; border: 2px solid var(--ink); border-radius: 16px;
      padding: 20px; display: flex; gap: 10px; flex-wrap: wrap;
      box-shadow: 0 18px 34px -22px rgba(20,24,31,0.4);
    }
    .lookup input {
      flex: 1; min-width: 180px; border: 1.5px solid var(--line); border-radius: 10px;
      padding: 14px 16px; font-family: 'JetBrains Mono', monospace; font-size: 16px;
      background: var(--paper); text-transform: uppercase;
    }
    .lookup input:focus { outline: 2px solid var(--denim); border-color: var(--denim); }
    .lookup button {
      background: var(--denim); color: #fff; border: none; border-radius: 10px;
      padding: 14px 22px; font-weight: 700; font-size: 14px; cursor: pointer; transition: background .15s ease;
    }
    .lookup button:hover { background: var(--denim-dark); }
    .lookup button:disabled { background: #c7c7c7; cursor: not-allowed; }

    .lookup button.btn-clear {
      background: #e5e7eb;
      color: #374151;
    }
    .lookup button.btn-clear:hover {
      background: #d1d5db;
    }

    .status { margin-top: 14px; font-size: 13.5px; }
    .status.error { color: #b3453a; }
    .status.loading { color: #6b7280; }
    .status.success { color: var(--green-dark); font-weight: 600; }
    .card {
      display: none; margin-top: 24px; background: #fff; border: 2px solid var(--ink);
      border-radius: 18px; padding: 28px 26px; box-shadow: 0 30px 60px -30px rgba(20,24,31,0.4);
    }
    .card.show { display: block; }
    .card .oid { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; margin-bottom: 4px; }
    .card .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px; color: #6b7280; margin: 16px 0 4px; }
    .card .label:first-of-type { margin-top: 18px; }
    .card p { margin: 2px 0; font-size: 14.5px; color: #28394a; line-height: 1.5; }
    .card .sub-line { font-size: 13px; color: #6b7280; }
    table.items { width: 100%; border-collapse: collapse; margin-top: 8px; }
    table.items th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: #6b7280; border-bottom: 2px solid var(--ink); padding: 0 8px 8px 0; }
    table.items td { font-size: 13.5px; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); }
    table.items td.qty { text-align: center; font-family: 'JetBrains Mono', monospace; }
    .total-line { display: flex; justify-content: space-between; margin-top: 14px; font-size: 16px; font-weight: 700; }
    .total-line .amt { font-family: 'JetBrains Mono', monospace; }
    .decision { display: flex; gap: 12px; margin-top: 26px; }
    .decision button {
      flex: 1; border: none; border-radius: 14px; padding: 18px 12px;
      font-weight: 800; font-size: 16px; cursor: pointer; transition: transform .1s ease, opacity .15s ease; color: #fff;
    }
    .decision button:active { transform: scale(0.97); }
    .decision button:disabled { opacity: .5; cursor: not-allowed; }
    .decision .handover { background: var(--green); }
    .decision .handover:hover { background: var(--green-dark); }
    .decision .failed { background: var(--red); }
    .decision .failed:hover { background: var(--red-dark); }
    .reset-hint { text-align: center; margin-top: 18px; font-size: 12.5px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brandbar">
      <div class="mark">
        <img src="https://raw.githubusercontent.com/ShopSlipper/ShopSlipper/main/WhatsApp%20Image%202026-07-20%20at%202.17.32%20PM.jpeg" alt="ShopSlipper logo">
      </div>
      <div>
        <h1>ShopSlipper</h1>
        <div class="sub">Scanned — Delivery Handover</div>
      </div>
    </div>

    <div class="lookup">
      <input type="text" id="orderIdInput" placeholder="Enter Order ID, E.G. SS7364174NP" autocomplete="off" />
      <button type="button" id="lookupBtn">Find</button>
      <button type="button" id="clearBtn" class="btn-clear">Clear</button>
    </div>

    <div class="status" id="statusMsg"></div>

    <div class="card" id="card">
      <div class="oid mono" id="cOrderId"></div>
      <div class="sub-line" id="cDate"></div>
      <div class="label">Customer</div>
      <p id="cName"></p>
      <p class="sub-line" id="cPhone"></p>
      <p class="sub-line" id="cAddress"></p>
      <div class="label">Items</div>
      <table class="items">
        <thead><tr><th>Item</th><th>Options</th><th style="text-align:center;">Qty</th></tr></thead>
        <tbody id="cItems"></tbody>
      </table>
      <div class="total-line"><span>Total (COD)</span><span class="amt" id="cTotal">—</span></div>
      <div class="decision" id="decisionButtons">
        <button type="button" class="handover" id="handoverBtn">✅ Handover</button>
        <button type="button" class="failed" id="failedBtn">❌ Failed</button>
      </div>
      <div class="reset-hint">Scan the next order anytime — this will reset automatically.</div>
    </div>
  </div>

  <script>
    // IMPORTANT: this now points at a published CSV of the "Processing Orders"
    // sheet, not the raw "Orders" sheet. An order only shows up here once it
    // has actually been invoiced (moved into Processing) — which also means
    // there's no such thing as "already marked" anymore: if it's still in
    // Processing, it hasn't been handed over or failed yet.
    //
    // To get this URL: open the sheet -> File -> Share -> Publish to web ->
    // choose the "Processing Orders" tab -> format: CSV -> Publish, then
    // paste the resulting link below.
    const PROCESSING_ORDERS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSclnzIDnbWJ9KhDFUrA-cNDsUhIte3Np20P288ZwiannuwCtB34BDNSw5LMvpD_nTAgzG9IezAfiju/pub?gid=78980778&single=true&output=csv";

    const STATUS_UPDATE_URL = "https://script.google.com/macros/s/AKfycbwlpeLl_caJdrbbJa84qUCf3LRrs6hSkqBouLwrknCev4b6AtXZo_gEyIdG9YYDXJXd/exec";
    const CONFIG = { currency: "Rs" };

    let currentOrderData = null;

    function parseCsv(text){
      const rows = []; let row = [], field = "", inQuotes = false;
      for (let i=0; i<text.length; i++){
        const c = text[i], next = text[i+1];
        if (inQuotes){
          if (c === '"' && next === '"'){ field += '"'; i++; }
          else if (c === '"'){ inQuotes = false; }
          else field += c;
        } else {
          if (c === '"') inQuotes = true;
          else if (c === ','){ row.push(field); field = ""; }
          else if (c === '\n' || c === '\r'){
            if (c === '\r' && next === '\n') continue;
            row.push(field); field = "";
            if (row.length > 1 || row[0] !== "") rows.push(row);
            row = [];
          } else field += c;
        }
      }
      if (field.length || row.length){ row.push(field); rows.push(row); }
      return rows;
    }

    // Processing Orders columns: Timestamp, Order ID, Customer Name, Phone, Address, Email, Items, Total
    function csvToOrders(text){
      const rows = parseCsv(text);
      if (!rows.length) return [];
      const header = rows[0].map(h => h.trim().toLowerCase().replace(/[^a-z0-9]/g, ''));
      return rows.slice(1).filter(r => r.length > 1 || r[0]).map(r => {
        const obj = {};
        header.forEach((h,i) => obj[h] = (r[i] || "").trim());
        return {
          timestamp: obj['timestamp'] || "",
          orderId: obj['orderid'] || "",
          name: obj['customername'] || "",
          phone: obj['phone'] || "",
          address: obj['address'] || "",
          email: obj['email'] || "",
          items: obj['items'] || "",
          total: obj['total'] || ""
        };
      });
    }

    function parseItemsString(itemsStr){
      if (!itemsStr) return [];
      const items = [];
      const re = /([^,[]+?)\s*\[SKU:\s*([^\]]+)\]\s*\[([^\]]+)\]\s*\(x(\d+)\)/g;
      let m;
      while ((m = re.exec(itemsStr)) !== null){
        items.push({ name: m[1].replace(/^,\s*/, '').trim(), options: m[3].trim(), qty: m[4] });
      }
      if (!items.length && itemsStr.trim()){
        items.push({ name: itemsStr.trim(), options: "—", qty: "—" });
      }
      return items;
    }

    function escapeHtml(str){ return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function formatMoney(v){
      if (!v) return "—";
      const strVal = String(v).replace(/[^0-9.]/g, '');
      const n = Number(strVal);
      return CONFIG.currency + " " + (isNaN(n) ? (v || "0") : n.toLocaleString());
    }

    function setStatus(msg, type){
      const el = document.getElementById('statusMsg');
      el.textContent = msg || '';
      el.className = 'status' + (type ? ' ' + type : '');
    }

    function resetLookupUI() {
      document.getElementById('orderIdInput').value = '';
      document.getElementById('card').classList.remove('show');
      setStatus('');
      currentOrderData = null;
      document.getElementById('orderIdInput').focus();
    }

    function renderCard(order){
      currentOrderData = order;
      document.getElementById('cOrderId').textContent = order.orderId || "—";
      document.getElementById('cDate').textContent = order.timestamp || "";
      document.getElementById('cName').textContent = order.name || "—";
      document.getElementById('cPhone').textContent = "📱 " + (order.phone || "—");
      document.getElementById('cAddress').textContent = "📍 " + (order.address || "—");

      const items = parseItemsString(order.items);
      document.getElementById('cItems').innerHTML = items.map(it => `
        <tr>
          <td>${escapeHtml(it.name)}</td>
          <td>${escapeHtml(it.options)}</td>
          <td class="qty">${escapeHtml(it.qty)}</td>
        </tr>
      `).join('');

      document.getElementById('cTotal').textContent = formatMoney(order.total);

      document.querySelectorAll('#decisionButtons button').forEach(b => b.disabled = false);
      document.getElementById('card').classList.add('show');
    }

    async function lookupOrder(){
      const rawInput = document.getElementById('orderIdInput').value;
      const targetId = rawInput.replace(/\s+/g, '').toLowerCase();
      if (!targetId){
        setStatus('Please scan or enter an Order ID.', 'error');
        return;
      }
      if (!PROCESSING_ORDERS_CSV_URL || PROCESSING_ORDERS_CSV_URL.indexOf('PASTE_YOUR') === 0){
        setStatus('PROCESSING_ORDERS_CSV_URL is not configured yet — see the comment at the top of the script.', 'error');
        return;
      }

      const btn = document.getElementById('lookupBtn');
      btn.disabled = true;
      setStatus('Fetching order…', 'loading');
      document.getElementById('card').classList.remove('show');

      try {
        const res = await fetch(PROCESSING_ORDERS_CSV_URL + (PROCESSING_ORDERS_CSV_URL.includes('?') ? '&' : '?') + '_=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const orders = csvToOrders(text);
        const match = orders.find(o => o.orderId.replace(/\s+/g, '').toLowerCase() === targetId);

        if (!match){
          setStatus(`No order found in Processing matching "${rawInput}". It may not be invoiced yet, or has already been handed over / marked failed.`, 'error');
          return;
        }

        renderCard(match);
        setStatus('');
      } catch (err){
        console.error(err);
        setStatus('Could not load order data — please try again.', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    // Uses a GET request (query string) instead of a no-cors POST, so the
    // real JSON response from Apps Script can actually be read here — a
    // rejection (e.g. "must be processed first") now shows up as an error
    // instead of being silently treated as success.
    async function markDelivery(status){
      if (!currentOrderData || !currentOrderData.orderId) return;
      if (!STATUS_UPDATE_URL){
        setStatus('Status update URL not configured.', 'error');
        return;
      }

      document.querySelectorAll('#decisionButtons button').forEach(b => b.disabled = true);
      setStatus('Saving…', 'loading');

      try {
        const params = new URLSearchParams({
          orderId: currentOrderData.orderId,
          action: status.toLowerCase(),
          items: currentOrderData.items || "",
          email: currentOrderData.email || ""
        });
        const res = await fetch(STATUS_UPDATE_URL + '?' + params.toString());
        const result = await res.json();

        if (result.status !== 'success'){
          setStatus(result.message || 'Could not save status.', 'error');
          document.querySelectorAll('#decisionButtons button').forEach(b => b.disabled = false);
          return;
        }

        setStatus(`Marked as "${status}" ✓`, 'success');
      } catch(err){
        console.error(err);
        setStatus('Could not save status — check connection and try again.', 'error');
        document.querySelectorAll('#decisionButtons button').forEach(b => b.disabled = false);
        return;
      }

      setTimeout(()=>{
        resetLookupUI();
      }, 1100);
    }

    document.getElementById('lookupBtn').addEventListener('click', lookupOrder);
    document.getElementById('clearBtn').addEventListener('click', resetLookupUI);

    document.getElementById('orderIdInput').addEventListener('keydown', (e)=>{
      if (e.key === 'Enter'){ e.preventDefault(); lookupOrder(); }
    });

    document.getElementById('handoverBtn').addEventListener('click', ()=> markDelivery('Handover'));
    document.getElementById('failedBtn').addEventListener('click', ()=> markDelivery('Failed'));

    document.getElementById('orderIdInput').focus();
    document.addEventListener('click', (e)=>{
      const tag = e.target.tagName;
      if (tag !== 'INPUT' && tag !== 'BUTTON'){
        document.getElementById('orderIdInput').focus();
      }
    });
  </script>
</body>
</html>

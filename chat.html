<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopSlipper — Chat</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef6f2;--card:#fffefe;--text:#182220;--muted:#6f8582;
  --line:#dbe9e3;--soft:#e6f2ee;--danger:#b5493e;
  --radius:18px;--shadow:0 20px 50px rgba(20,40,38,.08);
  --serif:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#eef7f1 0%,#eaf2f2 45%,#e9f0f6 100%) fixed;color:var(--text);line-height:1.5;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer;border:0}
.container{width:min(900px,calc(100% - 32px));margin:auto}
#gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gateBox{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:40px;width:min(380px,100%);text-align:center}
.gateBox h1{font-family:var(--serif);font-weight:600;font-size:24px;margin-bottom:6px}
.gateBox p{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.gateBox input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;margin-bottom:12px;font-size:14px}
.gateBox input:focus{border-color:var(--text)}
.gateErr{color:var(--danger);font-size:12.5px;margin-bottom:10px;display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:999px;background:#111;color:#fff;font-weight:600;font-size:13px}
.btn.light{background:#fff;color:#111;border:1px solid var(--line)}
.btn.sm{padding:8px 13px;font-size:12px}
#app{display:none}
header{background:rgba(248,246,241,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--serif);font-weight:600;font-size:18px}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
main{padding:28px 0 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.panelHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.panelHead h2{font-family:var(--serif);font-weight:600;font-size:19px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:10px 8px;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.chatSessionRow{cursor:pointer}
.chatSessionRow:hover td{background:var(--soft)}
.unreadTag{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--danger);color:#fff}
.statusTag{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--soft)}
.emptyMsg{text-align:center;color:var(--muted);padding:40px 10px;font-size:13.5px}
.modalBg{position:fixed;inset:0;background:rgba(15,25,22,.4);display:none;place-items:center;z-index:60;padding:18px}
.modalBg.open{display:grid}
.modalBox{background:#fff;border-radius:22px;width:min(480px,100%);padding:0;display:flex;flex-direction:column;max-height:85vh;overflow:hidden}
.chatModalHead{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}
.chatModalHead h3{font-family:var(--serif);font-weight:600;font-size:19px;margin-bottom:2px}
.chatModalHead small{color:var(--muted);font-size:12px}
.iconBtn{width:32px;height:32px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-size:13px}
.chatThread{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;background:var(--bg);min-height:200px}
.chatBubble{max-width:80%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.4}
.chatBubble.customer{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.chatBubble.staff{align-self:flex-end;background:#111;color:#fff;border-bottom-right-radius:4px}
.chatBubble small{display:block;margin-top:4px;font-size:10px;opacity:.6}
.chatReplyRow{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.chatReplyRow input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 15px;outline:none;font-size:13.5px}
.chatReplyRow input:focus{border-color:var(--text)}
.chatSendBtn{width:42px;height:42px;border-radius:50%;background:#111;color:#fff;font-size:16px;flex-shrink:0}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);background:#111;color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){table,thead,tbody,th,td,tr{display:block}thead{display:none}td{border:0;padding:4px 8px}tr{border-bottom:1px solid var(--line);padding:10px 0}}
</style>
</head>
<body>

<!-- ============================================================
 PASSWORD: change CHAT_KEY below to your own secret — it must
 match CHAT_KEY in Code.gs. Give this page + password only to
 staff who reply to customer chats. This is a simple client-side
 gate, not real security: fine for keeping casual visitors out,
 not for anything truly sensitive.
============================================================= -->

<div id="gate">
 <div class="gateBox">
  <h1>Chat access</h1>
  <p>Enter the chat staff password to view and reply to customer messages.</p>
  <div class="gateErr" id="gateErr">Incorrect password. Try again.</div>
  <input type="password" id="gatePass" placeholder="Password" onkeydown="if(event.key==='Enter')tryLogin()">
  <button class="btn" style="width:100%" onclick="tryLogin()">Enter →</button>
 </div>
</div>

<div id="app">
<header>
 <div class="container nav">
  <div class="brand">Shop Slipper<small>Chat</small></div>
  <div><button class="btn light sm" onclick="loadSessions()">↻ Refresh</button> <button class="btn light sm" onclick="logout()">Log out</button></div>
 </div>
</header>
<main>
 <div class="container">
  <div class="panel">
   <div class="panelHead"><h2>Conversations <span style="color:var(--muted);font-weight:400" id="chatCountLabel"></span></h2></div>
   <div style="overflow:auto">
   <table>
    <thead><tr><th>Customer</th><th>Last message</th><th>When</th><th>Status</th></tr></thead>
    <tbody id="chatRows"></tbody>
   </table>
   </div>
   <div class="emptyMsg" id="emptyChat" style="display:none">No conversations yet.</div>
  </div>
 </div>
</main>
</div>

<div class="modalBg" id="chatModal" onclick="if(event.target===this)closeChatThread()">
 <div class="modalBox">
  <div class="chatModalHead">
   <div><h3 id="chatModalName">Customer</h3><small id="chatModalPhone"></small></div>
   <button class="iconBtn" onclick="closeChatThread()">×</button>
  </div>
  <div class="chatThread" id="chatThread"></div>
  <form class="chatReplyRow" onsubmit="sendStaffReply(event)">
   <input id="chatReplyInput" placeholder="Type a reply…" autocomplete="off">
   <button class="chatSendBtn" aria-label="Send">➤</button>
  </form>
 </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================== CONFIG ================== */
const SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE"; // same URL as index.html / admin.html, ends in /exec
const CHAT_KEY   = "shopslipperchat2026";          // must match CHAT_KEY in Code.gs
/* =============================================
 Honest note: CHAT_KEY is a shared client-side
 password, not real authentication — anyone who
 reads this page's source can see it. It keeps
 casual visitors out but isn't real security.
================================================*/

let chatSessions = [];
let activeChatSessionId = null;

function tryLogin(){
 const val = document.querySelector("#gatePass").value;
 if(val === CHAT_KEY){
  sessionStorage.setItem("ss-chat-ok","1");
  document.querySelector("#gate").style.display="none";
  document.querySelector("#app").style.display="block";
  loadSessions();
 }else{
  document.querySelector("#gateErr").style.display="block";
 }
}
function logout(){
 sessionStorage.removeItem("ss-chat-ok");
 location.reload();
}
if(sessionStorage.getItem("ss-chat-ok")==="1"){
 document.querySelector("#gate").style.display="none";
 document.querySelector("#app").style.display="block";
}

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }

async function loadSessions(){
 try{
  const res = await fetch(`${SCRIPT_URL}?action=chatSessions&key=${encodeURIComponent(CHAT_KEY)}`);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  chatSessions = data.sessions || [];
  renderChatSessions();
 }catch(err){
  document.querySelector("#chatRows").innerHTML = "";
  toast("Couldn't reach the Sheet — check SCRIPT_URL and CHAT_KEY.");
 }
}
setInterval(()=>{ if(sessionStorage.getItem("ss-chat-ok")==="1") loadSessions(); }, 15000);

function renderChatSessions(){
 const rows = document.querySelector("#chatRows");
 document.querySelector("#chatCountLabel").textContent = `(${chatSessions.length})`;
 document.querySelector("#emptyChat").style.display = chatSessions.length ? "none" : "block";
 rows.innerHTML = chatSessions.map(c=>`
  <tr class="chatSessionRow" onclick="openChatThread('${c.sessionId}')">
   <td><b>${escapeHtml(c.name)||"Anonymous visitor"}</b>${c.phone?`<br><small style="color:var(--muted)">${escapeHtml(c.phone)}</small>`:""}</td>
   <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(c.lastText)}</td>
   <td>${c.lastTime ? new Date(c.lastTime).toLocaleString() : ""}</td>
   <td>${c.unread>0 ? `<span class="unreadTag">${c.unread} new</span>` : `<span class="statusTag">Replied</span>`}</td>
  </tr>`).join("");
}
async function openChatThread(sessionId){
 activeChatSessionId = sessionId;
 const session = chatSessions.find(c=>c.sessionId===sessionId);
 document.querySelector("#chatModalName").textContent = (session && session.name) || "Customer";
 document.querySelector("#chatModalPhone").textContent = (session && session.phone) || "";
 document.querySelector("#chatThread").innerHTML = `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:20px">Loading…</div>`;
 document.querySelector("#chatModal").classList.add("open");
 await loadChatThread(sessionId);
}
async function loadChatThread(sessionId){
 try{
  const res = await fetch(`${SCRIPT_URL}?action=chatMessages&sessionId=${encodeURIComponent(sessionId)}`);
  const data = await res.json();
  const el = document.querySelector("#chatThread");
  const msgs = data.messages || [];
  el.innerHTML = msgs.length
   ? msgs.map(m=>`<div class="chatBubble ${m.from}"><span>${escapeHtml(m.text)}</span><small>${m.time||""}</small></div>`).join("")
   : `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:20px">No messages yet.</div>`;
  el.scrollTop = el.scrollHeight;
 }catch(err){
  document.querySelector("#chatThread").innerHTML = `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:20px">Couldn't load messages.</div>`;
 }
}
function closeChatThread(){
 document.querySelector("#chatModal").classList.remove("open");
 activeChatSessionId = null;
 loadSessions();
}
async function sendStaffReply(e){
 e.preventDefault();
 const input = document.querySelector("#chatReplyInput");
 const text = input.value.trim();
 if(!text || !activeChatSessionId) return;
 input.value="";
 try{
  await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"sendChatMessage",key:CHAT_KEY,sessionId:activeChatSessionId,message:text})});
  await loadChatThread(activeChatSessionId);
 }catch(err){
  toast("Couldn't send — check your connection and try again.");
 }
}

let toastTimer;
function toast(t){
 const e = document.querySelector("#toast");
 e.textContent = t; e.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer = setTimeout(()=>e.classList.remove("show"), 2200);
}
</script>
</body>
</html>

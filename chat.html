<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopSlipper — Chat</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef6f2;--card:#fffefe;--text:#182220;--muted:#6f8582;
  --line:#8fd3a6;--accent:var(--gold);--soft:#e6f2ee;--danger:#b5493e;
  --gold:#077F38;--sage:#077F38;--radius:18px;--shadow:0 20px 50px rgba(20,40,38,.08);
  --serif:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
a{color:inherit}
#gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#eef7f1 0%,#eaf2f2 45%,#e9f0f6 100%) fixed}
.gateBox{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:40px;width:min(380px,100%);text-align:center}
.gateBox h1{font-family:var(--serif);font-weight:600;font-size:24px;margin-bottom:6px}
.gateBox p{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.gateBox input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;margin-bottom:12px;font-size:14px}
.gateBox input:focus{border-color:var(--text)}
.gateErr{color:var(--danger);font-size:12.5px;margin-bottom:10px;display:none}
#app{display:none;flex-direction:column;height:100vh}

/* Header — solid green fill, matching the customer-facing chat widget's
   header. Fixed height, doesn't scroll with content below it. */
header{background:var(--gold);color:#fff;flex-shrink:0;box-shadow:0 2px 10px rgba(6,50,28,.15);z-index:10}
.nav{height:70px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:18px}
.brand .mark{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.5)}
.brand small{display:block;color:rgba(255,255,255,.75);font-weight:400;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.headActions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:999px;background:var(--gold);color:#fff;font-weight:600;font-size:13px;transition:.2s transform,.2s opacity}
.btn:hover{transform:translateY(-1px);opacity:.9}
.btn.sm{padding:8px 13px;font-size:12px}
.btn.headerBtn{background:rgba(255,255,255,.15);color:#fff}
.btn.headerBtn:hover{background:rgba(255,255,255,.25)}

/* ---- Full-height, edge-to-edge layout: sidebar flush to the left,
   thread panel flush under the header with no gap or card boundary,
   same idea as a two-pane chat app (list + conversation). ---- */
main{flex:1;min-height:0;display:flex}
.chatLayout{flex:1;min-height:0;display:flex;width:100%}

.sidebarPanel{width:320px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panelHead{padding:18px 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-shrink:0}
.panelHead h2{font-family:var(--serif);font-weight:600;font-size:18px}
.note{margin:0 18px 12px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:12px;color:var(--muted);flex-shrink:0}
.note b{color:var(--text)}
.tabDot{position:relative;top:-1px;background:var(--danger);color:#fff;min-width:17px;height:17px;padding:0 4px;border-radius:999px;font-size:10px;font-weight:700;display:none;place-items:center;margin-left:4px}
.spinning{display:inline-block;animation:spin360 .7s linear}
@keyframes spin360{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);background:var(--gold);color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1;transform:translate(-50%,0)}

.convList{flex:1;overflow:auto;padding:4px 12px 12px}
.emptyMsg{text-align:center;color:var(--muted);padding:40px 10px;font-size:13.5px}

/* Rows show ONLY name + phone number — no preview text, no timestamp. */
.convRow{border-radius:12px;padding:11px 12px;cursor:pointer;transition:.15s;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.convRow:hover{background:var(--soft)}
.convRow.active{background:var(--soft)}
.convRow .name{font-weight:700;font-size:13.5px}
.convRow .phone{font-size:11.5px;color:var(--muted);margin-top:1px}
.convRow .typingLabel{font-size:11px;color:var(--gold);font-style:italic;margin-top:1px}
.unreadTag{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--danger);color:#fff;flex-shrink:0}

/* Thread panel: sits flush under the header, edge to edge, no card
   border or radius — its own head bar is the only thing separating it
   from the messages below, just like the sidebar. */
.threadPanel{flex:1;min-width:0;background:var(--card);display:flex;flex-direction:column;min-height:0}
.threadEmpty{flex:1;display:grid;place-items:center;color:var(--muted);font-size:13.5px;text-align:center;padding:20px}
.threadActive{display:none;flex-direction:column;flex:1;min-height:0}
.threadActive.open{display:flex}
.threadHead{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-shrink:0}
.threadHead h3{font-family:var(--serif);font-weight:600;font-size:16.5px}
.threadHead small{color:var(--muted);font-size:12px}
.iconBtn{width:32px;height:32px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.iconBtn:hover{background:var(--line)}
.chatThread{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.chatBubble{max-width:78%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.4;position:relative}
.chatBubble.customer{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.chatBubble.staff{align-self:flex-end;background:var(--gold);color:#fff;border-bottom-right-radius:4px}
.chatBubble small{display:block;margin-top:4px;font-size:10px;opacity:.6}
.chatBubble.hasImg{padding:6px}
.chatImg{display:block;max-width:220px;max-height:220px;width:100%;object-fit:cover;border-radius:12px;cursor:zoom-in;margin-bottom:4px}
.msgDelBtn{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;font-size:11px;line-height:1;display:grid;place-items:center;opacity:0;transition:.15s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.chatBubble:hover .msgDelBtn{opacity:1}
.imgLightbox{position:fixed;inset:0;background:rgba(10,20,18,.85);display:grid;place-items:center;z-index:200;padding:24px;cursor:zoom-out}
.imgLightbox img{max-width:100%;max-height:100%;border-radius:10px}

.typingBar{display:none;align-items:center;gap:10px;padding:10px 22px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--card);flex-shrink:0}
.typingBar.show{display:flex}
.typingBar b{color:var(--text)}
.typingBarDots{display:inline-flex;align-items:center;gap:4px}
.typingBarDots span{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.5;animation:typingBounce 1s infinite ease-in-out}
.typingBarDots span:nth-child(2){animation-delay:.15s}
.typingBarDots span:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

.chatReplyRow{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--line);flex-shrink:0;background:var(--card);align-items:center}
.chatReplyRow input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 15px;outline:none;font-size:13.5px}
.chatReplyRow input:focus{border-color:var(--text)}
.chatSendBtn{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;font-size:16px;flex-shrink:0}
.chatSendBtn:disabled{opacity:.6;cursor:default}
.chatAttachBtn{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--gold);font-size:15px;flex-shrink:0;display:grid;place-items:center}
.chatAttachBtn:hover{background:var(--line)}
.imagePreviewBar{display:flex;align-items:center;gap:10px;padding:10px 22px;border-top:1px solid var(--line);background:#fff;flex-shrink:0}
.imagePreviewBar img{width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.imagePreviewBar span{flex:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imagePreviewBar button{width:24px;height:24px;border-radius:50%;background:var(--soft);font-size:12px;flex-shrink:0}

@media(max-width:820px){
 .chatLayout{flex-direction:column}
 .sidebarPanel{width:100%;border-right:0;border-bottom:1px solid var(--line);max-height:40vh}
 .threadPanel{flex:1}
}
</style>
</head>
<body>

<!-- ============================================================
 PASSWORD: change ADMIN_KEY in the <script> below to match
 ADMIN_KEY in Code.gs (same value used in admin.html) — the
 backend only knows one key, so this page and the main admin
 page must use the same one. This is a simple client-side gate,
 not real security: anyone who reads this file's source can see
 it. Fine for keeping casual visitors out, not for anything
 truly sensitive.
============================================================= -->

<div id="gate">
 <div class="gateBox">
  <h1>Chat access</h1>
  <p>Enter your admin password to reply to customer chats.</p>
  <div class="gateErr" id="gateErr">Incorrect password. Try again.</div>
  <input type="password" id="gatePass" placeholder="Password" onkeydown="if(event.key==='Enter')tryLogin()">
  <button class="btn" style="width:100%" onclick="tryLogin()">Enter →</button>
 </div>
</div>

<div id="app">
<header>
 <div class="nav">
  <div class="brand"><img class="mark" src="https://raw.githubusercontent.com/ShopSlipper/ShopSlipper/main/shop_slipper_transparent.png" alt="Shop Slipper logo"><div>Shop Slipper<small>Chat</small></div></div>
  <div class="headActions">
   <button class="btn headerBtn sm" id="refreshBtn" onclick="loadChatSessions()"><span id="refreshIcon">↻</span> Refresh</button>
   <button class="btn headerBtn sm" onclick="logout()">Log out</button>
  </div>
 </div>
</header>

<main>
 <div class="chatLayout">

  <div class="sidebarPanel">
   <div class="panelHead"><h2>Chats <span style="color:var(--muted);font-weight:400" id="chatCountLabel"></span><span class="tabDot" id="chatTabDot">0</span></h2></div>
   <div class="note" id="sourceNote">Loading conversations…</div>
   <div class="convList" id="chatRows"></div>
   <div class="emptyMsg" id="emptyChat" style="display:none">No conversations yet.</div>
  </div>

  <div class="threadPanel">
   <div class="threadEmpty" id="threadEmpty">Select a conversation from the list to read and reply.</div>
   <div class="threadActive" id="threadActive">
    <div class="threadHead">
     <div><h3 id="chatModalName">Customer</h3><small id="chatModalPhone"></small></div>
     <button class="iconBtn" onclick="closeChatThread()" title="Close">×</button>
    </div>
    <div class="chatThread" id="chatThread"></div>
    <div class="typingBar" id="typingBar">
     <span class="typingBarDots"><span></span><span></span><span></span></span>
     <span id="typingBarText"></span>
    </div>
    <div class="imagePreviewBar" id="imagePreviewBar" style="display:none">
     <img id="imagePreviewThumb" alt="">
     <span id="imagePreviewName"></span>
     <button type="button" id="imagePreviewCancel" aria-label="Remove photo">✕</button>
    </div>
    <form class="chatReplyRow" onsubmit="sendStaffReply(event)">
     <button type="button" class="chatAttachBtn" id="attachBtn" title="Attach a photo" aria-label="Attach a photo">📷</button>
     <input type="file" id="chatImageInput" accept="image/png,image/jpeg,image/webp" style="display:none">
     <input id="chatReplyInput" placeholder="Type a reply…" autocomplete="off">
     <button class="chatSendBtn" id="chatSendBtn" aria-label="Send">➤</button>
    </form>
   </div>
  </div>

 </div>
</main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================== CONFIG ==================
 Must match SCRIPT_URL and ADMIN_KEY in admin.html / Code.gs.
=============================================== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzKHLu21Y5oJeM7KQ5dcI3mTXpNnZlDRoTn19nCuqZ7SNb73S6cj9QaTY2Sd-QHTFoE/exec";
const ADMIN_KEY  = "shopslipper2026";

let chatSessions = [];
let activeChatSessionId = null;
let currentTypingSessions = []; // last result of action=typingStatus

function tryLogin(){
 const val = document.querySelector("#gatePass").value;
 if(val === ADMIN_KEY){
  sessionStorage.setItem("ss-chat-ok","1");
  document.querySelector("#gate").style.display="none";
  document.querySelector("#app").style.display="flex";
  loadChatSessions();
  loadTypingStatus();
 }else{
  document.querySelector("#gateErr").style.display="block";
 }
}
function logout(){
 sessionStorage.removeItem("ss-chat-ok");
 location.reload();
}
if(sessionStorage.getItem("ss-chat-ok")==="1"){
 document.querySelector("#gate").style.display="none";
 document.querySelector("#app").style.display="flex";
 loadChatSessions();
 loadTypingStatus();
}

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }

async function loadChatSessions(){
 const refreshIcon = document.querySelector("#refreshIcon");
 const refreshBtn = document.querySelector("#refreshBtn");
 if(refreshIcon){
  refreshIcon.classList.remove("spinning");
  void refreshIcon.offsetWidth;
  refreshIcon.classList.add("spinning");
 }
 if(refreshBtn) refreshBtn.disabled = true;
 try{
  const res = await fetch(`${SCRIPT_URL}?action=chatSessions&key=${encodeURIComponent(ADMIN_KEY)}`);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  chatSessions = data.sessions || [];
  document.querySelector("#sourceNote").innerHTML = `Connected — <b>${chatSessions.length}</b> conversations.`;
  renderChatSessions();
 }catch(err){
  document.querySelector("#sourceNote").innerHTML = `Couldn't reach the Sheet. Check your connection and try refreshing.`;
 }finally{
  if(refreshBtn) refreshBtn.disabled = false;
 }
}
setInterval(()=>{ if(sessionStorage.getItem("ss-chat-ok")==="1"){ loadChatSessions(); loadTypingStatus(); if(activeChatSessionId) loadChatThread(activeChatSessionId); } }, 5000);

// Staff-side: which CUSTOMERS are currently typing, across all sessions.
// Used to (a) show a scoped "Customer is typing…" bar under whichever
// conversation is open, and (b) mark that in the sidebar row too.
async function loadTypingStatus(){
 try{
  const res = await fetch(`${SCRIPT_URL}?action=typingStatus&key=${encodeURIComponent(ADMIN_KEY)}`);
  const data = await res.json();
  currentTypingSessions = data.typing || [];
  renderChatSessions();

  const bar = document.querySelector("#typingBar");
  const text = document.querySelector("#typingBarText");
  const mine = activeChatSessionId ? currentTypingSessions.find(t=>t.sessionId===activeChatSessionId) : null;
  if(mine){
   text.innerHTML = `<b>${escapeHtml(mine.name || "This customer")}</b> is typing…`;
   bar.classList.add("show");
  }else{
   bar.classList.remove("show");
  }
 }catch(err){
  // Silent — the typing bar just stays as it was; this isn't worth a toast.
 }
}

function renderChatSessions(){
 chatSessions = [...chatSessions].sort((a,b)=> new Date(b.lastTime) - new Date(a.lastTime));
 const rows = document.querySelector("#chatRows");
 document.querySelector("#chatCountLabel").textContent = `(${chatSessions.length})`;
 document.querySelector("#emptyChat").style.display = chatSessions.length ? "none" : "block";
 const totalUnread = chatSessions.reduce((s,c)=>s+(c.unread||0),0);
 const dot = document.querySelector("#chatTabDot");
 if(totalUnread>0){ dot.style.display="inline-grid"; dot.textContent = totalUnread>9?"9+":totalUnread; }
 else dot.style.display="none";

 // Rows show ONLY the customer's name and phone number — no message
 // preview, no timestamp — swapping to a "Typing…" label in place of
 // the phone number for whichever session is currently typing.
 rows.innerHTML = chatSessions.map(c=>{
  const typingNow = currentTypingSessions.some(t=>t.sessionId===c.sessionId);
  return `
  <div class="convRow${c.sessionId===activeChatSessionId?' active':''}" onclick="openChatThread('${c.sessionId}')">
   <div>
    <div class="name">${escapeHtml(c.name)||"Anonymous visitor"}</div>
    ${typingNow ? `<div class="typingLabel">Typing…</div>` : (c.phone ? `<div class="phone">${escapeHtml(c.phone)}</div>` : ``)}
   </div>
   ${c.unread>0 ? `<span class="unreadTag">${c.unread}</span>` : ``}
  </div>`;
 }).join("");
}

async function openChatThread(sessionId){
 activeChatSessionId = sessionId;
 const session = chatSessions.find(c=>c.sessionId===sessionId);
 document.querySelector("#chatModalName").textContent = (session && session.name) || "Customer";
 document.querySelector("#chatModalPhone").textContent = (session && session.phone) || "";
 document.querySelector("#threadEmpty").style.display = "none";
 document.querySelector("#threadActive").classList.add("open");
 document.querySelector("#chatThread").innerHTML = `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:20px">Loading…</div>`;
 renderChatSessions(); // highlight the active row
 await loadChatThread(sessionId);
 loadTypingStatus(); // refresh the scoped typing bar for this conversation right away
 document.querySelector("#chatReplyInput").focus();
}
async function loadChatThread(sessionId){
 try{
  const res = await fetch(`${SCRIPT_URL}?action=chatMessages&sessionId=${encodeURIComponent(sessionId)}`);
  const data = await res.json();
  const el = document.querySelector("#chatThread");
  const msgs = data.messages || [];
  el.innerHTML = msgs.length
   ? msgs.map(m=>{
      const imgPart = m.imageUrl ? `<img class="chatImg" src="${escapeHtml(m.imageUrl)}" onclick="openImageLightbox('${escapeHtml(m.imageUrl)}')" alt="photo">` : ``;
      const textPart = m.text ? `<span>${escapeHtml(m.text)}</span>` : ``;
      const delBtn = m.messageId ? `<button type="button" class="msgDelBtn" title="Hide this message" onclick="deleteMessage('${m.messageId}')">✕</button>` : ``;
      return `<div class="chatBubble ${m.from}${m.imageUrl?' hasImg':''}">${delBtn}${imgPart}${textPart}<small>${m.time||""}</small></div>`;
     }).join("")
   : `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:20px">No messages yet.</div>`;
  el.scrollTop = el.scrollHeight;
 }catch(err){
  document.querySelector("#chatThread").innerHTML = `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:20px">Couldn't load messages.</div>`;
 }
}
function closeChatThread(){
 activeChatSessionId = null;
 document.querySelector("#threadActive").classList.remove("open");
 document.querySelector("#threadEmpty").style.display = "grid";
 document.querySelector("#typingBar").classList.remove("show");
 renderChatSessions();
 loadChatSessions();
}
async function sendStaffReply(e){
 e.preventDefault();
 const input = document.querySelector("#chatReplyInput");
 const text = input.value.trim();
 if((!text && !pendingStaffImage) || !activeChatSessionId) return;
 input.value="";
 const imageToSend = pendingStaffImage;
 clearImagePreview();

 let imageUrl = "";
 if(imageToSend){
  const sendBtn = document.querySelector("#chatSendBtn");
  sendBtn.disabled = true;
  try{
   // Reuses the same public action=uploadChatImage endpoint the
   // customer widget uses (no key needed there — see Code.gs). Staff
   // could also go through the admin-only action=uploadImage, but
   // that writes into the PRODUCT image folder; this keeps staff
   // photos in the same chat folder as customer photos.
   const res = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
    action:"uploadChatImage",
    sessionId: activeChatSessionId,
    data: imageToSend.base64,
    filename: imageToSend.filename,
    mimeType: imageToSend.mimeType
   })});
   const data = await res.json();
   if(data.error) throw new Error(data.error);
   imageUrl = data.url;
  }catch(err){
   sendBtn.disabled = false;
   toast("Couldn't send photo — " + (err.message || "please try again."));
   return;
  }
  sendBtn.disabled = false;
 }

 // No local "sending…" bubble here on purpose: staff should never see
 // their own typing/sending dots. The customer sees the "Typing…"
 // animation instead, driven by the setTyping pings below and cleared
 // automatically the moment this message actually lands (see
 // clearTyping_ in Code.gs).
 try{
  await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"sendChatMessage",key:ADMIN_KEY,sessionId:activeChatSessionId,message:text,imageUrl})});
  await loadChatThread(activeChatSessionId);
  loadChatSessions(); // background refresh so this chat jumps to the top immediately, not on the next 5s poll
 }catch(err){
  toast("Couldn't send — check your connection and try again.");
 }
}

/* ================== Staff photo attach: pick, downscale, preview ==================
   Same pattern as chat-widget.html's customer-side attach flow — picks
   a file, downscales it client-side via canvas, shows a thumbnail +
   cancel before anything actually uploads.
========================================================================= */
const MAX_STAFF_IMAGE_DIMENSION = 1280;
let pendingStaffImage = null;

document.querySelector("#attachBtn").addEventListener("click", ()=>{
 document.querySelector("#chatImageInput").click();
});
document.querySelector("#chatImageInput").addEventListener("change", handleStaffImageSelect);
document.querySelector("#imagePreviewCancel").addEventListener("click", clearImagePreview);

async function handleStaffImageSelect(e){
 const file = e.target.files[0];
 e.target.value = "";
 if(!file) return;
 if(!/^image\/(jpeg|png|webp)$/.test(file.type)){
  toast("Please choose a JPEG, PNG, or WebP photo.");
  return;
 }
 try{
  const { base64, mimeType, dataUrl } = await downscaleImage(file);
  pendingStaffImage = { base64, mimeType, filename: file.name || "photo.jpg" };
  document.querySelector("#imagePreviewThumb").src = dataUrl;
  document.querySelector("#imagePreviewName").textContent = pendingStaffImage.filename;
  document.querySelector("#imagePreviewBar").style.display = "flex";
 }catch(err){
  toast("Couldn't read that photo — please try another.");
 }
}
function clearImagePreview(){
 pendingStaffImage = null;
 document.querySelector("#imagePreviewBar").style.display = "none";
 document.querySelector("#imagePreviewThumb").src = "";
 document.querySelector("#imagePreviewName").textContent = "";
}
function downscaleImage(file){
 return new Promise((resolve, reject)=>{
  const reader = new FileReader();
  reader.onerror = ()=> reject(new Error("Couldn't read file"));
  reader.onload = ()=>{
   const img = new Image();
   img.onerror = ()=> reject(new Error("Couldn't load image"));
   img.onload = ()=>{
    let w = img.width, h = img.height;
    if(w > MAX_STAFF_IMAGE_DIMENSION || h > MAX_STAFF_IMAGE_DIMENSION){
     const scale = MAX_STAFF_IMAGE_DIMENSION / Math.max(w,h);
     w = Math.round(w*scale); h = Math.round(h*scale);
    }
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    const mimeType = "image/jpeg";
    const dataUrl = canvas.toDataURL(mimeType, 0.82);
    resolve({ base64: dataUrl.split(",")[1], mimeType, dataUrl });
   };
   img.src = reader.result;
  };
  reader.readAsDataURL(file);
 });
}

// Staff-side moderation: hides a bad/inappropriate message (image or
// text) from the conversation. Soft-delete on the backend (see
// deleteChatMessage_ in Code.gs) — the row stays in the sheet marked
// "deleted", it's just filtered out of chatMessages/chatSessions from
// then on, so there's still a record if you ever need to check it.
async function deleteMessage(messageId){
 if(!confirm("Hide this message from the conversation? The customer will no longer see it either.")) return;
 try{
  const res = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"deleteChatMessage",key:ADMIN_KEY,messageId})});
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  await loadChatThread(activeChatSessionId);
 }catch(err){
  toast("Couldn't remove — check your connection and try again.");
 }
}

function openImageLightbox(url){
 const overlay = document.createElement("div");
 overlay.className = "imgLightbox";
 overlay.onclick = ()=> overlay.remove();
 const img = document.createElement("img");
 img.src = url;
 img.onclick = (e)=> e.stopPropagation();
 overlay.appendChild(img);
 document.body.appendChild(overlay);
}

/* ================== Staff -> customer typing indicator ==================
   Pings action=setTyping (with ADMIN_KEY, so the backend tags it as
   "staff") while this staff member has text in the reply box. The
   customer's chat widget polls for this and shows the "Typing…"
   animation. Throttled the same way the customer widget throttles its
   own pings, and silently ignored on failure.
========================================================================= */
let staffTypingLastPing = 0;
function pingStaffTyping(){
 if(!activeChatSessionId) return;
 const now = Date.now();
 if(now - staffTypingLastPing < 2000) return;
 staffTypingLastPing = now;
 fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"setTyping",key:ADMIN_KEY,sessionId:activeChatSessionId})}).catch(()=>{});
}
document.querySelector("#chatReplyInput").addEventListener("input", pingStaffTyping);

let toastTimer;
function toast(t){
 const e = document.querySelector("#toast");
 e.textContent = t; e.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer = setTimeout(()=>e.classList.remove("show"), 2200);
}
</script>

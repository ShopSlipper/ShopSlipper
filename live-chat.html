<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with us — ShopSlipper</title>
<link rel="icon" href="https://raw.githubusercontent.com/ShopSlipper/ShopSlipper/main/shop_slipper_transparent.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef6f2;--card:#fffefe;--text:#182220;--muted:#6f8582;
  --line:#8fd3a6;--gold:#077F38;--soft:#e6f2ee;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#eef7f1 0%,#eaf2f2 45%,#e9f0f6 100%) fixed;color:var(--text);display:flex;flex-direction:column}
button,input{font:inherit}
button{cursor:pointer;border:0}
a{color:inherit;text-decoration:none}
header{background:var(--gold);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 2px 10px rgba(6,50,28,.15)}
header a.brand{display:flex;align-items:center;gap:10px}
header img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.5)}
header .backLink{margin-left:auto;font-size:13px;font-weight:600;background:rgba(255,255,255,.15);padding:8px 14px;border-radius:999px}
header .titleBlock b{display:block;font-size:15px}
header .titleBlock small{opacity:.75;font-size:11.5px}
main{flex:1;display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto;padding:16px;min-height:0}
.chatCard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.chatStartForm{padding:26px 22px}
.chatStartForm p{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:700}
.field input{border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;width:100%}
.field input:focus{border-color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:999px;background:var(--gold);color:#fff;font-weight:600;font-size:14px;width:100%}
.chatThreadWrap{display:flex;flex-direction:column;flex:1;min-height:0}
.chatMessages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.chatEmpty{color:var(--muted);font-size:13px;text-align:center;padding:40px 10px}
.msgRow{display:flex;flex-direction:column;max-width:100%}
.msgRow.me{align-items:flex-end}
.msgRow.staff{align-items:flex-start}
.chatBubble{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.45}
.chatBubble.me{align-self:flex-end;background:var(--gold);color:#fff;border-bottom-right-radius:4px}
.chatBubble.staff{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.chatBubble small{display:block;margin-top:4px;font-size:10.5px;opacity:.65}
.chatBubble a{color:inherit;text-decoration:underline}
.chatBubble.hasImg{padding:6px}
.chatBubble.failed{opacity:.75;border:1px solid #b5493e!important;cursor:pointer}
.chatBubble.failed .retryHint{color:#b5493e;opacity:1}
.chatBubble.manageable{cursor:pointer}
.chatImg{display:block;max-width:220px;max-height:220px;width:100%;object-fit:cover;border-radius:12px;cursor:zoom-in;margin-bottom:4px}
/* Typing animation: shown as a staff-style bubble with three bouncing
   dots instead of text, while the backend says staff is typing. */
.chatBubble.typingDots{display:flex;align-items:center;gap:5px;padding:14px 16px}
.chatBubble.typingDots span{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.5;animation:typingBounce 1s infinite ease-in-out}
.chatBubble.typingDots span:nth-child(2){animation-delay:.15s}
.chatBubble.typingDots span:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
/* Edit/Delete action row shown under a tapped customer bubble */
.msgActions{display:flex;gap:6px;margin-top:5px}
.msgActions button{background:var(--soft);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700;color:var(--gold)}
.msgActions button.danger{color:#b5493e}
.msgActions button:hover{background:var(--line)}
/* Inline edit row replaces bubble text while editing */
.editRow{display:flex;gap:6px;align-items:center;width:100%;min-width:180px}
.editRow input{flex:1;border-radius:10px;border:1px solid rgba(255,255,255,.7);padding:7px 10px;font-size:13.5px;color:var(--text);background:#fff}
.editRow button{font-size:11px;font-weight:700;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.28);color:#fff;flex-shrink:0}
.imagePreviewBar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:#fff;flex-shrink:0}
.imagePreviewBar img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.imagePreviewBar span{flex:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imagePreviewBar button{width:26px;height:26px;border-radius:50%;background:var(--soft);font-size:13px;flex-shrink:0}
.imgLightbox{position:fixed;inset:0;background:rgba(10,20,18,.85);display:grid;place-items:center;z-index:200;padding:24px;cursor:zoom-out}
.imgLightbox img{max-width:100%;max-height:100%;border-radius:10px}
.chatErrMsg{padding:8px 14px;font-size:12px;color:#b5493e;background:#fdeeec;border-top:1px solid var(--line);flex-shrink:0;display:none}
.chatErrMsg.show{display:block}
.chatMessagesWrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.scrollBottomBtn{position:absolute;right:14px;bottom:14px;width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;font-size:18px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(6,50,28,.3);z-index:5}
.scrollBottomBtn:hover{filter:brightness(1.08)}
.scrollBottomBadge{position:absolute;top:-4px;right:-4px;background:#b5493e;color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;padding:0 4px;display:none;align-items:center;justify-content:center;line-height:1;border:2px solid var(--bg)}
.chatInputRow{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line);background:#fff;flex-shrink:0;align-items:center}
.chatInputRow input{flex:1;border:1px solid var(--line);border-radius:999px;padding:12px 16px;outline:none;font-size:14px}
.chatInputRow input:focus{border-color:var(--text)}
.chatSendBtn{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#fff;font-size:17px;flex-shrink:0}
.chatSendBtn:disabled{opacity:.6;cursor:default}
.chatAttachBtn{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--gold);font-size:16px;flex-shrink:0;display:grid;place-items:center}
.chatAttachBtn:hover{background:var(--line)}
@media(max-width:480px){
main{padding:0}
.chatCard{border-radius:0;border-left:0;border-right:0;border-bottom:0}
/* A long unbroken string (like a full URL) has nowhere to wrap by
   default, so the browser was stretching the bubble — and the
   messages panel along with it — sideways instead, which is what
   produced the horizontal scrollbar. Forcing a break keeps the text
   inside the bubble, so the scrollbar is never needed. */
.chatBubble{overflow-wrap:anywhere;word-break:break-word}
.chatBubble a{overflow-wrap:anywhere;word-break:break-all}
.chatMessages{overflow-x:hidden}
}
</style>
</head>
<body>
<header>
 <a class="brand" href="index.html">
  <img src="https://raw.githubusercontent.com/ShopSlipper/ShopSlipper/main/shop_slipper_transparent.png" alt="ShopSlipper logo">
  <span class="titleBlock"><b>Chat with us</b><small>Step into your comfort.</small></span>
 </a>
 <a class="backLink" href="index.html">← Back to shop</a>

</header>

<main>
 <div class="chatCard">
  <form id="chatStartForm" class="chatStartForm" onsubmit="startChatWithInfo(event)">
   <p>Tell us a little about you so our team can get back to you.</p>
   <div class="field"><label>Name</label><input required name="name" placeholder="Your name"></div>
   <div class="field"><label>Phone (optional)</label><input name="phone" placeholder="98XXXXXXXX"></div>
   <button class="btn">Start chat</button>
  </form>
  <div class="chatThreadWrap" id="chatThreadWrap" style="display:none">
   <div class="chatMessagesWrap">
    <div class="chatMessages" id="chatMessages"></div>
    <button type="button" id="scrollBottomBtn" class="scrollBottomBtn" aria-label="Scroll to latest messages">
     ↓
     <span id="scrollBottomBadge" class="scrollBottomBadge"></span>
    </button>
   </div>
   <div class="chatErrMsg" id="chatErrMsg"></div>
   <div class="imagePreviewBar" id="imagePreviewBar" style="display:none">
    <img id="imagePreviewThumb" alt="">
    <span id="imagePreviewName"></span>
    <button type="button" id="imagePreviewCancel" aria-label="Remove photo">✕</button>
   </div>
   <form class="chatInputRow" onsubmit="sendChatMessage(event)">
    <button type="button" class="chatAttachBtn" id="attachBtn" title="Attach a photo" aria-label="Attach a photo">📷</button>
    <input type="file" id="chatImageInput" accept="image/png,image/jpeg,image/webp" style="display:none">
    <input id="chatInput" placeholder="Type a message…" autocomplete="off">
    <button class="chatSendBtn" id="chatSendBtn" aria-label="Send">➤</button>
   </form>
  </div>
 </div>
</main>

<script>
/* Same backend and same localStorage keys as index.html's old widget, so
   a conversation started here is picked up if you ever open the site's
   chat badge, and vice versa. */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxKtGFQmHlwZmbfe-TKMDlzuI5KBFau8PDBkC5MYSyMA_ISe1SpC3lbBLfptHw-4l1/exec";
const POLL_MS = 5000;
const TYPING_POLL_MS = 2500;
// Photos are downscaled client-side before upload (see downscaleImage
// below) — this is just a client-side sanity cap so a huge original
// photo doesn't sit re-encoding forever; the backend enforces its own
// hard size/type/rate limits regardless of what the client sends.
const MAX_IMAGE_DIMENSION = 1280;

// FIX: quotes are now escaped too (not just & < >). escapeHtml's output
// used to be dropped straight into inline onclick="...('${...}')"
// attributes elsewhere in this file — an unescaped quote in that
// position could break out of the JS string and inject script. This
// was previously defined twice in this file (harmless duplication,
// removed here) with the weaker (no-quote-escaping) version.
function escapeHtml(s){
 const d=document.createElement("div"); d.textContent=s||"";
 return d.innerHTML.replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
// Escapes message text (so it stays inert/safe) and then turns any
// http(s) URL inside it into a real clickable <a> — this is what makes
// links in chat messages tappable instead of just inert text.
function linkifyText(s){
 const escaped = escapeHtml(s);
 return escaped.replace(/(https?:\/\/[^\s<]+)/g, (match)=>{
  let url = match, trailing = "";
  while(url.length && /[.,!?;:)\]'"]/.test(url[url.length-1])){
   trailing = url[url.length-1] + trailing;
   url = url.slice(0, -1);
  }
  return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${trailing}`;
 });
}

let chatSessionId = localStorage.getItem("shopslipper-chat-id");
let chatInfo = JSON.parse(localStorage.getItem("shopslipper-chat-info")||"null");
let chatMessages = JSON.parse(localStorage.getItem("shopslipper-chat-msgs")||"[]");
let pollTimer = null;
let typingPollTimer = null;
let isStaffTypingNow = false;
let awaitingStaffMessage = false; // true = staff just stopped typing; keep dots on until the real message actually arrives
let awaitingTimeout = null;
let pendingImage = null;
let sendInFlight = false;  // {base64, mimeType, filename, dataUrl} staged but not yet sent
let hasFetchedMessagesOnce = false; // guards the "received" sound from firing on the very first load
let activeMenuId = null; // key of the customer message whose Edit/Delete row is open, or null
let editingId = null;    // key of the customer message currently being edited inline, or null
let unseenCount = 0;     // messages that arrived while the customer was scrolled up

// Shared "close enough to the bottom to auto-scroll" check, used both to
// decide whether to snap to the newest message on render and to decide
// whether the "jump to latest" button should be showing.
function isNearBottom(el){
 return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
}
// Shows/hides the floating scroll-to-bottom button and its unread badge
// based on the current scroll position. Called after every render and
// on manual scrolling.
function updateScrollButton(){
 const el = document.querySelector("#chatMessages");
 const btn = document.querySelector("#scrollBottomBtn");
 const badge = document.querySelector("#scrollBottomBadge");
 if(!el || !btn || !badge) return;
 if(isNearBottom(el)){
  btn.style.display = "none";
  badge.style.display = "none";
  unseenCount = 0;
 }else{
  btn.style.display = "flex";
  if(unseenCount > 0){
   badge.textContent = unseenCount > 9 ? "9+" : String(unseenCount);
   badge.style.display = "flex";
  }else{
   badge.style.display = "none";
  }
 }
}

function ensureChatSession(){
 if(!chatSessionId){
  // FIX: previously "C"+Date.now().toString(36)+4 random chars — the
  // timestamp portion isn't secret, so a session ID could realistically
  // be brute-forced/guessed (chatMessages requires no auth beyond the
  // ID). Now generated with 128 bits of real randomness via the Web
  // Crypto API, making guessing computationally infeasible.
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  chatSessionId = "C" + Array.from(bytes, b => b.toString(16).padStart(2,"0")).join("");
  localStorage.setItem("shopslipper-chat-id", chatSessionId);
 }
}
function showThread(){
 document.querySelector("#chatStartForm").style.display = "none";
 document.querySelector("#chatThreadWrap").style.display = "flex";
 renderChatMessages();
 fetchChatMessages();
 if(!pollTimer) pollTimer = setInterval(fetchChatMessages, POLL_MS);
 if(!typingPollTimer) typingPollTimer = setInterval(pollStaffTyping, TYPING_POLL_MS);
 document.querySelector("#chatInput").focus();
}
function init(){
 ensureChatSession();
 if(!chatInfo){
  document.querySelector("#chatStartForm").style.display = "block";
  document.querySelector("#chatThreadWrap").style.display = "none";
 }else{
  showThread();
 }
}
function startChatWithInfo(e){
 e.preventDefault();
 const form = new FormData(e.target);
 chatInfo = { name: form.get("name"), phone: form.get("phone") };
 localStorage.setItem("shopslipper-chat-info", JSON.stringify(chatInfo));
 showThread();
}
// Stable key for a message: prefer the server-assigned id (once the
// backend sends one back in chatMessages), fall back to the client-side
// pendingId for messages that haven't round-tripped yet.
function msgKey(m){ return m.id || m.pendingId || null; }

function renderChatMessages(){
 const el = document.querySelector("#chatMessages");
 const wasNearBottom = isNearBottom(el);
 if(!chatMessages.length && !isStaffTypingNow){
  el.innerHTML = `<div class="chatEmpty">Say hello! Our team will reply here shortly.</div>`;
 }else{
  let html = chatMessages.map(m=>{
   const cls = m.from==='staff' ? 'staff' : 'me';
   const key = msgKey(m);
   // Only the customer's own, successfully-sent text/image messages can
   // be edited or deleted — not staff messages, and not ones still
   // pending/failed (those are retried instead, see retryFailedMessage).
   const canManage = cls==='me' && !m.failed && !!key;

   if(canManage && editingId===key){
    const safeKey = escapeHtml(key);
    return `<div class="msgRow me">
      <div class="chatBubble me${m.imageUrl?' hasImg':''}">
       ${m.imageUrl?`<img class="chatImg" src="${escapeHtml(m.imageUrl)}" alt="photo">`:``}
       <div class="editRow">
        <input id="editInput_${safeKey}" value="${escapeHtml(m.text||"")}">
        <button type="button" onclick="saveEditedMessage('${safeKey}')">Save</button>
        <button type="button" onclick="cancelEditMessage()">Cancel</button>
       </div>
      </div>
     </div>`;
   }

   const imgPart = m.imageUrl ? `<img class="chatImg" src="${escapeHtml(m.imageUrl)}" onclick="openImageLightbox(event,'${escapeHtml(m.imageUrl)}')" alt="photo">` : ``;
   const textPart = m.text ? `<span>${linkifyText(m.text)}</span>` : ``;
   const smallPart = m.failed ? `<small class="retryHint">Not sent — tap to retry</small>` : `<small>${m.time||""}${m.edited?" · edited":""}</small>`;
   let clickAttr = ``;
   if(m.failed && m.pendingId) clickAttr = ` onclick="retryFailedMessage('${escapeHtml(m.pendingId)}')"`;
   else if(canManage) clickAttr = ` onclick="toggleMessageActions(event,'${escapeHtml(key)}')"`;
   const bubble = `<div class="chatBubble ${cls}${m.imageUrl?' hasImg':''}${m.failed?' failed':''}${canManage?' manageable':''}"${clickAttr}>${imgPart}${textPart}${smallPart}</div>`;
   const actions = (canManage && activeMenuId===key) ? `<div class="msgActions" onclick="event.stopPropagation()">
      <button type="button" onclick="startEditMessage('${escapeHtml(key)}')">Edit</button>
      <button type="button" class="danger" onclick="confirmDeleteMessage('${escapeHtml(key)}')">Delete</button>
     </div>` : ``;
   return `<div class="msgRow ${cls}">${bubble}${actions}</div>`;
  }).join("");
  if(isStaffTypingNow){
   html += `<div class="msgRow staff"><div class="chatBubble staff typingDots"><span></span><span></span><span></span></div></div>`;
  }
  el.innerHTML = html;
 }
 if(wasNearBottom) el.scrollTop = el.scrollHeight;
 updateScrollButton();
}

// Manual scrolling (or reaching the bottom via the scroll button) should
// re-check whether the "jump to latest" button needs to show.
document.querySelector("#chatMessages").addEventListener("scroll", updateScrollButton);
document.querySelector("#scrollBottomBtn").addEventListener("click", ()=>{
 const el = document.querySelector("#chatMessages");
 el.scrollTo({top: el.scrollHeight, behavior: "smooth"});
 unseenCount = 0;
 updateScrollButton();
});

// Tapping anywhere else closes an open action row.
document.addEventListener("click", ()=>{
 if(activeMenuId){ activeMenuId = null; renderChatMessages(); }
});

function toggleMessageActions(e, key){
 e.stopPropagation();
 activeMenuId = (activeMenuId === key) ? null : key;
 renderChatMessages();
}

function startEditMessage(key){
 activeMenuId = null;
 editingId = key;
 renderChatMessages();
 setTimeout(()=>{
  const inp = document.getElementById("editInput_"+key);
  if(inp){ inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
 }, 0);
}
function cancelEditMessage(){
 editingId = null;
 renderChatMessages();
}

// Saves an edit optimistically, then confirms with the backend. Requires
// the backend (Apps Script) to support an "editChatMessage" action that
// accepts {sessionId, messageId, pendingId, text} and updates the stored
// message — add that endpoint alongside sendChatMessage. If the request
// fails, the edit is rolled back locally.
async function saveEditedMessage(key){
 const inp = document.getElementById("editInput_"+key);
 const newText = inp ? inp.value.trim() : "";
 if(!newText){ showChatError("Message can't be empty."); return; }
 const m = chatMessages.find(x => msgKey(x) === key);
 if(!m){ editingId = null; renderChatMessages(); return; }
 const oldText = m.text, wasEdited = !!m.edited;
 m.text = newText; m.edited = true;
 editingId = null;
 localStorage.setItem("shopslipper-chat-msgs", JSON.stringify(chatMessages));
 renderChatMessages();
 try{
  const res = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
   action:"editChatMessage", sessionId:chatSessionId,
   messageId: m.id||null, pendingId: m.pendingId||null, text:newText
  })});
  const data = await res.json();
  if(data.error) throw new Error(data.error);
 }catch(err){
  m.text = oldText; m.edited = wasEdited;
  localStorage.setItem("shopslipper-chat-msgs", JSON.stringify(chatMessages));
  renderChatMessages();
  showChatError("Couldn't save your edit — please try again.");
 }
}

// Deletes optimistically, then confirms with the backend. Requires a
// "deleteChatMessage" action accepting {sessionId, messageId, pendingId}.
// Restores the message locally if the backend call fails.
function confirmDeleteMessage(key){
 activeMenuId = null;
 renderChatMessages();
 if(!confirm("Delete this message?")) return;
 deleteMessage(key);
}
async function deleteMessage(key){
 const idx = chatMessages.findIndex(x => msgKey(x) === key);
 if(idx===-1) return;
 const [removed] = chatMessages.splice(idx,1);
 localStorage.setItem("shopslipper-chat-msgs", JSON.stringify(chatMessages));
 renderChatMessages();
 try{
  const res = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
   action:"deleteChatMessage", sessionId:chatSessionId,
   messageId: removed.id||null, pendingId: removed.pendingId||null
  })});
  const data = await res.json();
  if(data.error) throw new Error(data.error);
 }catch(err){
  chatMessages.splice(idx,0,removed);
  localStorage.setItem("shopslipper-chat-msgs", JSON.stringify(chatMessages));
  renderChatMessages();
  showChatError("Couldn't delete that message — please try again.");
 }
}

function showChatError(msg){
 const el = document.querySelector("#chatErrMsg");
 el.textContent = msg;
 el.classList.add("show");
 clearTimeout(showChatError._t);
 showChatError._t = setTimeout(()=>el.classList.remove("show"), 4000);
}
async function sendChatMessage(e){
 e.preventDefault();
 const input = document.querySelector("#chatInput");
 const text = input.value.trim();
 if(!text && !pendingImage) return;
 input.value = "";
 const imageToSend = pendingImage;
 clearImagePreview();

 let imageUrl = "";
 if(imageToSend){
  const sendBtn = document.querySelector("#chatSendBtn");
  sendBtn.disabled = true;
  try{
   const res = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
    action:"uploadChatImage",
    sessionId: chatSessionId,
    data: imageToSend.base64,
    filename: imageToSend.filename,
    mimeType: imageToSend.mimeType
   })});
   const data = await res.json();
   if(data.error) throw new Error(data.error);
   imageUrl = data.url;
  }catch(err){
   sendBtn.disabled = false;
   showChatError(err.message || "Couldn't send that photo — please try again.");
   return;
  }
  sendBtn.disabled = false;
 }

 await postChatMessage_(text, imageUrl);
}

// Sends (or re-sends) a text+image pair. Split out from sendChatMessage so a
// failed send can be retried without re-uploading the photo.
async function postChatMessage_(text, imageUrl){
 const pendingId = "P" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
 sendInFlight = true;
 chatMessages.push({from:"customer", text, imageUrl, time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}), pendingId, failed:false});
 localStorage.setItem("shopslipper-chat-msgs", JSON.stringify(chatMessages));
 renderChatMessages();
 playSentSound();
 try{
  const res = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"sendChatMessage",sessionId:chatSessionId,name:chatInfo?.name||"",phone:chatInfo?.phone||"",message:text,imageUrl})});
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  sendInFlight = false;
  const confirmedMsg = chatMessages.find(x=>x.pendingId===pendingId);
  if(confirmedMsg){
   confirmedMsg.confirmed = true;
   // If the backend returned the new message's id (e.g. a row id), keep
   // it so this message can be targeted for edit/delete even before the
   // next fetchChatMessages() poll.
   if(data.id) confirmedMsg.id = data.id;
  }
  fetchChatMessages(); // safe now — the server has it, so sync right away
  pollStaffTyping(); // check immediately instead of waiting up to 2.5s for the next scheduled poll
 }catch(err){
  // The server never actually got this message, so resyncing now would just
  // erase it from view. Mark it failed instead so it can be retried — this
  // is the fix: previously this always re-fetched regardless of outcome,
  // which wiped the message on any network hiccup.
  sendInFlight = false;
  const m = chatMessages.find(x=>x.pendingId===pendingId);
  if(m){ m.failed = true; localStorage.setItem("shopslipper-chat-msgs", JSON.stringify(chatMessages)); }
  renderChatMessages();
 }
}
function retryFailedMessage(pendingId){
 const idx = chatMessages.findIndex(m=>m.pendingId===pendingId);
 if(idx===-1) return;
 const m = chatMessages[idx];
 chatMessages.splice(idx,1);
 localStorage.setItem("shopslipper-chat-msgs", JSON.stringify(chatMessages));
 postChatMessage_(m.text, m.imageUrl);
}
async function fetchChatMessages(){
 if(!chatSessionId || sendInFlight) return;
 try{
  const res = await fetch(`${SCRIPT_URL}?action=chatMessages&sessionId=${encodeURIComponent(chatSessionId)}&_=${Date.now()}`, {cache:"no-store"});
  const data = await res.json();
  if(data && Array.isArray(data.messages)){
   const prevStaffCount = chatMessages.filter(m=>m.from==='staff').length;
   const prevTotalCount = chatMessages.length;

   const stillPending = chatMessages.filter(m => m.pendingId && !m.failed && !m.confirmed);
   chatMessages = [...data.messages, ...stillPending];

   // If the customer is scrolled up reading older messages, don't yank
   // them down — just tally what arrived so the scroll-to-bottom button
   // can show an unread count instead.
   const msgsEl = document.querySelector("#chatMessages");
   if(msgsEl && !isNearBottom(msgsEl)){
    const added = chatMessages.length - prevTotalCount;
    if(added > 0) unseenCount += added;
   }

   localStorage.setItem("shopslipper-chat-msgs", JSON.stringify(chatMessages));
   const newStaffCount = chatMessages.filter(m=>m.from==='staff').length;
   if(hasFetchedMessagesOnce && newStaffCount > prevStaffCount){
    playReceivedSound();
   }
   hasFetchedMessagesOnce = true;
   if(awaitingStaffMessage){
    awaitingStaffMessage = false;
    isStaffTypingNow = false;
    clearTimeout(awaitingTimeout);
   }
   // A poll can land mid-edit or mid-menu; only clear these if the
   // message they refer to no longer exists, so an in-progress edit
   // isn't yanked out from under the customer by a background refresh.
   if(activeMenuId && !chatMessages.some(m=>msgKey(m)===activeMenuId)) activeMenuId = null;
   if(editingId && !chatMessages.some(m=>msgKey(m)===editingId)) editingId = null;
   renderChatMessages();
  }
 }catch(err){ /* backend unreachable — ignore, retry next poll */ }
}

/* ================== Photo attach: pick, downscale, preview ==================
   Selecting a file downscales it client-side (keeps the upload small
   and keeps it comfortably under the backend's size cap) and shows a
   thumbnail + cancel option — nothing is uploaded until the customer
   actually hits send, same as a normal messaging app.
================================================================= */
document.querySelector("#attachBtn").addEventListener("click", ()=>{
 document.querySelector("#chatImageInput").click();
});
document.querySelector("#chatImageInput").addEventListener("change", handleImageSelect);
document.querySelector("#imagePreviewCancel").addEventListener("click", clearImagePreview);

async function handleImageSelect(e){
 const file = e.target.files[0];
 e.target.value = ""; // reset so picking the exact same file again still fires change
 if(!file) return;
 if(!/^image\/(jpeg|png|webp)$/.test(file.type)){
  showChatError("Please choose a JPEG, PNG, or WebP photo.");
  return;
 }
 try{
  const { base64, mimeType, dataUrl } = await downscaleImage(file);
  pendingImage = { base64, mimeType, filename: file.name || "photo.jpg", dataUrl };
  document.querySelector("#imagePreviewThumb").src = dataUrl;
  document.querySelector("#imagePreviewName").textContent = pendingImage.filename;
  document.querySelector("#imagePreviewBar").style.display = "flex";
 }catch(err){
  showChatError("Couldn't read that photo — please try another.");
 }
}
function clearImagePreview(){
 pendingImage = null;
 document.querySelector("#imagePreviewBar").style.display = "none";
 document.querySelector("#imagePreviewThumb").src = "";
 document.querySelector("#imagePreviewName").textContent = "";
}
// Reads the file, draws it to a canvas capped at MAX_IMAGE_DIMENSION on
// its longest side, and re-encodes as JPEG — this is what keeps a
// phone's 4000px camera photo from ever coming close to the backend's
// upload cap.
function downscaleImage(file){
 return new Promise((resolve, reject)=>{
  const reader = new FileReader();
  reader.onerror = ()=> reject(new Error("Couldn't read file"));
  reader.onload = ()=>{
   const img = new Image();
   img.onerror = ()=> reject(new Error("Couldn't load image"));
   img.onload = ()=>{
    let w = img.width, h = img.height;
    if(w > MAX_IMAGE_DIMENSION || h > MAX_IMAGE_DIMENSION){
     const scale = MAX_IMAGE_DIMENSION / Math.max(w,h);
     w = Math.round(w*scale); h = Math.round(h*scale);
    }
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    const mimeType = "image/jpeg";
    const dataUrl = canvas.toDataURL(mimeType, 0.82);
    resolve({ base64: dataUrl.split(",")[1], mimeType, dataUrl });
   };
   img.src = reader.result;
  };
  reader.readAsDataURL(file);
 });
}
function openImageLightbox(e, url){
 if(e) e.stopPropagation();
 const overlay = document.createElement("div");
 overlay.className = "imgLightbox";
 overlay.onclick = ()=> overlay.remove();
 const img = document.createElement("img");
 img.src = url;
 img.onclick = (ev)=> ev.stopPropagation();
 overlay.appendChild(img);
 document.body.appendChild(overlay);
}

/* ================== Typing indicator (both directions) ==================
   Outgoing: let staff know THIS customer is typing (existing behavior).
   Incoming: poll whether STAFF is typing back, and show animated dots
   for it — this is the actual "typing…" animation the customer sees.
========================================================================= */
let typingLastPing = 0;
function pingTyping(){
 if(!chatSessionId) return;
 const now = Date.now();
 if(now - typingLastPing < 2000) return;
 typingLastPing = now;
 fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"setTyping",sessionId:chatSessionId,name:chatInfo?.name||"",phone:chatInfo?.phone||""})}).catch(()=>{});
}
document.querySelector("#chatInput").addEventListener("input", pingTyping);

async function pollStaffTyping(){
 if(!chatSessionId) return;
 try{
  const res = await fetch(`${SCRIPT_URL}?action=staffTypingForSession&sessionId=${encodeURIComponent(chatSessionId)}`);
  const data = await res.json();
  const nowTyping = !!(data && data.typing);
  if(nowTyping){
   // Staff is actively typing — show dots right away.
   awaitingStaffMessage = false;
   clearTimeout(awaitingTimeout);
   if(!isStaffTypingNow){ isStaffTypingNow = true; renderChatMessages(); }
  }else if(isStaffTypingNow && !awaitingStaffMessage){
   // Staff just stopped typing (their reply is on its way). Keep the
   // dots showing and fetch immediately instead of waiting up to
   // POLL_MS for the next scheduled poll — fetchChatMessages() is what
   // actually turns the dots off, right when the real message shows up.
   awaitingStaffMessage = true;
   fetchChatMessages();
   // Safety net: if the message never arrives (send failed, etc.),
   // don't leave the dots up forever.
   clearTimeout(awaitingTimeout);
   awaitingTimeout = setTimeout(()=>{
    if(awaitingStaffMessage){
     awaitingStaffMessage = false;
     isStaffTypingNow = false;
     renderChatMessages();
    }
   }, 8000);
  }
 }catch(err){ /* silent — indicator just won't update this tick */ }
}

/* ================== Notification sounds ==================
   Tiny synthesized beeps via the Web Audio API — no audio files to
   host or fetch, so this works offline and never hits the network.
   Browsers block audio until the page has had a user gesture, so the
   AudioContext is created lazily (on first use, e.g. the customer's
   first tap/keystroke) and resumed on every play call.
============================================================= */
let audioCtx = null;
function getAudioCtx(){
 if(!audioCtx){
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  catch(e){ return null; }
 }
 if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
 return audioCtx;
}
// freqs: array of tone frequencies played back-to-back; each tone gets
// a quick attack + exponential decay so it sounds like a soft "blip"
// rather than a harsh square-wave beep.
function playTone(freqs, stepMs, gainVal){
 const ctx = getAudioCtx();
 if(!ctx) return;
 const now = ctx.currentTime;
 freqs.forEach((freq, i)=>{
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  const start = now + i*(stepMs/1000);
  const dur = stepMs/1000;
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(gainVal, start+0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, start+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start+dur+0.02);
 });
}
// Played when the customer sends a message.
function playSentSound(){ playTone([680], 90, 0.10); }
// Played when a new staff reply arrives.
function playReceivedSound(){ playTone([520, 780], 110, 0.13); }

init();
</script>

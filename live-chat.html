<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with us — ShopSlipper</title>
<link rel="icon" href="https://raw.githubusercontent.com/ShopSlipper/ShopSlipper/main/shop_slipper_transparent.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef6f2;--card:#fffefe;--text:#182220;--muted:#6f8582;
  --line:#8fd3a6;--gold:#077F38;--soft:#e6f2ee;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#eef7f1 0%,#eaf2f2 45%,#e9f0f6 100%) fixed;color:var(--text);display:flex;flex-direction:column}
button,input{font:inherit}
button{cursor:pointer;border:0}
a{color:inherit;text-decoration:none}
header{background:var(--gold);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 2px 10px rgba(6,50,28,.15)}
header a.brand{display:flex;align-items:center;gap:10px}
header img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.5)}
header .backLink{margin-left:auto;font-size:13px;font-weight:600;background:rgba(255,255,255,.15);padding:8px 14px;border-radius:999px}
header .titleBlock b{display:block;font-size:15px}
header .titleBlock small{opacity:.75;font-size:11.5px}
main{flex:1;display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto;padding:16px;min-height:0}
.chatCard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.chatStartForm{padding:26px 22px}
.chatStartForm p{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:700}
.field input{border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;width:100%}
.field input:focus{border-color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:999px;background:var(--gold);color:#fff;font-weight:600;font-size:14px;width:100%}
.chatThreadWrap{display:flex;flex-direction:column;flex:1;min-height:0}
.chatMessages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.chatEmpty{color:var(--muted);font-size:13px;text-align:center;padding:40px 10px}
.chatBubble{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.45}
.chatBubble.me{align-self:flex-end;background:var(--gold);color:#fff;border-bottom-right-radius:4px}
.chatBubble.staff{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.chatBubble small{display:block;margin-top:4px;font-size:10.5px;opacity:.65}
.chatInputRow{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line);background:#fff;flex-shrink:0}
.chatInputRow input{flex:1;border:1px solid var(--line);border-radius:999px;padding:12px 16px;outline:none;font-size:14px}
.chatInputRow input:focus{border-color:var(--text)}
.chatSendBtn{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#fff;font-size:17px;flex-shrink:0}
@media(max-width:480px){main{padding:0}.chatCard{border-radius:0;border-left:0;border-right:0;border-bottom:0}}
</style>
</head>
<body>
<header>
 <a class="brand" href="index.html">
  <img src="https://raw.githubusercontent.com/ShopSlipper/ShopSlipper/main/shop_slipper_transparent.png" alt="ShopSlipper logo">
  <span class="titleBlock"><b>Chat with us</b><small>We usually reply within a few hours</small></span>
 </a>
 <a class="backLink" href="index.html">← Back to shop</a>

</header>

<main>
 <div class="chatCard">
  <form id="chatStartForm" class="chatStartForm" onsubmit="startChatWithInfo(event)">
   <p>Tell us a little about you so our team can get back to you.</p>
   <div class="field"><label>Name</label><input required name="name" placeholder="Your name"></div>
   <div class="field"><label>Phone (optional)</label><input name="phone" placeholder="98XXXXXXXX"></div>
   <button class="btn">Start chat</button>
  </form>
  <div class="chatThreadWrap" id="chatThreadWrap" style="display:none">
   <div class="chatMessages" id="chatMessages"></div>
   <form class="chatInputRow" onsubmit="sendChatMessage(event)">
    <input id="chatInput" placeholder="Type a message…" autocomplete="off">
    <button class="chatSendBtn" aria-label="Send">➤</button>
   </form>
  </div>
 </div>
</main>

<script>
/* Same backend and same localStorage keys as index.html's old widget, so
   a conversation started here is picked up if you ever open the site's
   chat badge, and vice versa. */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzKHLu21Y5oJeM7KQ5dcI3mTXpNnZlDRoTn19nCuqZ7SNb73S6cj9QaTY2Sd-QHTFoE/exec";
const POLL_MS = 5000;

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }

let chatSessionId = localStorage.getItem("shopslipper-chat-id");
let chatInfo = JSON.parse(localStorage.getItem("shopslipper-chat-info")||"null");
let chatMessages = JSON.parse(localStorage.getItem("shopslipper-chat-msgs")||"[]");
let pollTimer = null;

function ensureChatSession(){
 if(!chatSessionId){
  chatSessionId = "C"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase();
  localStorage.setItem("shopslipper-chat-id", chatSessionId);
 }
}
function showThread(){
 document.querySelector("#chatStartForm").style.display = "none";
 document.querySelector("#chatThreadWrap").style.display = "flex";
 renderChatMessages();
 fetchChatMessages();
 if(!pollTimer) pollTimer = setInterval(fetchChatMessages, POLL_MS);
 document.querySelector("#chatInput").focus();
}
function init(){
 ensureChatSession();
 if(!chatInfo){
  document.querySelector("#chatStartForm").style.display = "block";
  document.querySelector("#chatThreadWrap").style.display = "none";
 }else{
  showThread();
 }
}
function startChatWithInfo(e){
 e.preventDefault();
 const form = new FormData(e.target);
 chatInfo = { name: form.get("name"), phone: form.get("phone") };
 localStorage.setItem("shopslipper-chat-info", JSON.stringify(chatInfo));
 showThread();
}
function renderChatMessages(){
 const el = document.querySelector("#chatMessages");
 if(!chatMessages.length){
  el.innerHTML = `<div class="chatEmpty">Say hello! Our team will reply here shortly.</div>`;
 }else{
  el.innerHTML = chatMessages.map(m=>`<div class="chatBubble ${m.from==='staff'?'staff':'me'}"><span>${escapeHtml(m.text)}</span><small>${m.time||""}</small></div>`).join("");
 }
 el.scrollTop = el.scrollHeight;
}
async function sendChatMessage(e){
 e.preventDefault();
 const input = document.querySelector("#chatInput");
 const text = input.value.trim();
 if(!text) return;
 chatMessages.push({from:"customer", text, time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})});
 localStorage.setItem("shopslipper-chat-msgs", JSON.stringify(chatMessages));
 renderChatMessages(); input.value="";
 try{
  await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"sendChatMessage",sessionId:chatSessionId,name:chatInfo?.name||"",phone:chatInfo?.phone||"",message:text})});
 }catch(err){ /* stays visible locally; will sync on next poll */ }
}
async function fetchChatMessages(){
 if(!chatSessionId) return;
 try{
  const res = await fetch(`${SCRIPT_URL}?action=chatMessages&sessionId=${encodeURIComponent(chatSessionId)}`);
  const data = await res.json();
  if(data && Array.isArray(data.messages)){
   chatMessages = data.messages;
   localStorage.setItem("shopslipper-chat-msgs", JSON.stringify(chatMessages));
   renderChatMessages();
  }
 }catch(err){ /* backend unreachable — ignore, retry next poll */ }
}

/* ================== Typing indicator ================== */
// Lets the staff chat page (chat.html) show "X is typing…" while this
// customer has text in the box. Fire-and-forget: throttled to at most
// once every 2 seconds so fast typists don't spam the backend, and
// silently ignored on failure — a missed ping just means the staff
// dots show up a beat late, nothing breaks either side.
let typingLastPing = 0;
function pingTyping(){
 if(!chatSessionId) return;
 const now = Date.now();
 if(now - typingLastPing < 2000) return;
 typingLastPing = now;
 fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"setTyping",sessionId:chatSessionId,name:chatInfo?.name||"",phone:chatInfo?.phone||""})}).catch(()=>{});
}
document.querySelector("#chatInput").addEventListener("input", pingTyping);

init();
</script>
</body>
</html>

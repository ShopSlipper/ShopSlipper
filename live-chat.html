<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with us — ShopSlipper</title>
<link rel="icon" href="https://raw.githubusercontent.com/ShopSlipper/ShopSlipper/main/shop_slipper_transparent.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef6f2;--card:#fffefe;--text:#182220;--muted:#6f8582;
  --line:#8fd3a6;--gold:#077F38;--soft:#e6f2ee;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#eef7f1 0%,#eaf2f2 45%,#e9f0f6 100%) fixed;color:var(--text);display:flex;flex-direction:column}
button,input{font:inherit}
button{cursor:pointer;border:0}
a{color:inherit;text-decoration:none}
header{background:var(--gold);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 2px 10px rgba(6,50,28,.15)}
header a.brand{display:flex;align-items:center;gap:10px}
header img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.5)}
header .backLink{margin-left:auto;font-size:13px;font-weight:600;background:rgba(255,255,255,.15);padding:8px 14px;border-radius:999px}
header .titleBlock b{display:block;font-size:15px}
header .titleBlock small{opacity:.75;font-size:11.5px}
main{flex:1;display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto;padding:16px;min-height:0}
.chatCard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.chatStartForm{padding:26px 22px}
.chatStartForm p{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:700}
.field input{border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;width:100%}
.field input:focus{border-color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:999px;background:var(--gold);color:#fff;font-weight:600;font-size:14px;width:100%}
.chatThreadWrap{display:flex;flex-direction:column;flex:1;min-height:0}
.chatMessages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.chatEmpty{color:var(--muted);font-size:13px;text-align:center;padding:40px 10px}
.chatBubble{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.45}
.chatBubble.me{align-self:flex-end;background:var(--gold);color:#fff;border-bottom-right-radius:4px}
.chatBubble.staff{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.chatBubble small{display:block;margin-top:4px;font-size:10.5px;opacity:.65}
.chatBubble.hasImg{padding:6px}
.chatImg{display:block;max-width:220px;max-height:220px;width:100%;object-fit:cover;border-radius:12px;cursor:zoom-in;margin-bottom:4px}
/* Typing animation: shown as a staff-style bubble with three bouncing
   dots instead of text, while the backend says staff is typing. */
.chatBubble.typingDots{display:flex;align-items:center;gap:5px;padding:14px 16px}
.chatBubble.typingDots span{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.5;animation:typingBounce 1s infinite ease-in-out}
.chatBubble.typingDots span:nth-child(2){animation-delay:.15s}
.chatBubble.typingDots span:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.imagePreviewBar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:#fff;flex-shrink:0}
.imagePreviewBar img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.imagePreviewBar span{flex:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imagePreviewBar button{width:26px;height:26px;border-radius:50%;background:var(--soft);font-size:13px;flex-shrink:0}
.imgLightbox{position:fixed;inset:0;background:rgba(10,20,18,.85);display:grid;place-items:center;z-index:200;padding:24px;cursor:zoom-out}
.imgLightbox img{max-width:100%;max-height:100%;border-radius:10px}
.chatErrMsg{padding:8px 14px;font-size:12px;color:#b5493e;background:#fdeeec;border-top:1px solid var(--line);flex-shrink:0;display:none}
.chatErrMsg.show{display:block}
.chatInputRow{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line);background:#fff;flex-shrink:0;align-items:center}
.chatInputRow input{flex:1;border:1px solid var(--line);border-radius:999px;padding:12px 16px;outline:none;font-size:14px}
.chatInputRow input:focus{border-color:var(--text)}
.chatSendBtn{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#fff;font-size:17px;flex-shrink:0}
.chatSendBtn:disabled{opacity:.6;cursor:default}
.chatAttachBtn{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--gold);font-size:16px;flex-shrink:0;display:grid;place-items:center}
.chatAttachBtn:hover{background:var(--line)}
@media(max-width:480px){main{padding:0}.chatCard{border-radius:0;border-left:0;border-right:0;border-bottom:0}}
</style>
</head>
<body>
<header>
 <a class="brand" href="index.html">
  <img src="https://raw.githubusercontent.com/ShopSlipper/ShopSlipper/main/shop_slipper_transparent.png" alt="ShopSlipper logo">
  <span class="titleBlock"><b>Chat with us</b><small>We usually reply within a few hours</small></span>
 </a>
 <a class="backLink" href="index.html">← Back to shop</a>

</header>

<main>
 <div class="chatCard">
  <form id="chatStartForm" class="chatStartForm" onsubmit="startChatWithInfo(event)">
   <p>Tell us a little about you so our team can get back to you.</p>
   <div class="field"><label>Name</label><input required name="name" placeholder="Your name"></div>
   <div class="field"><label>Phone (optional)</label><input name="phone" placeholder="98XXXXXXXX"></div>
   <button class="btn">Start chat</button>
  </form>
  <div class="chatThreadWrap" id="chatThreadWrap" style="display:none">
   <div class="chatMessages" id="chatMessages"></div>
   <div class="chatErrMsg" id="chatErrMsg"></div>
   <div class="imagePreviewBar" id="imagePreviewBar" style="display:none">
    <img id="imagePreviewThumb" alt="">
    <span id="imagePreviewName"></span>
    <button type="button" id="imagePreviewCancel" aria-label="Remove photo">✕</button>
   </div>
   <form class="chatInputRow" onsubmit="sendChatMessage(event)">
    <button type="button" class="chatAttachBtn" id="attachBtn" title="Attach a photo" aria-label="Attach a photo">📷</button>
    <input type="file" id="chatImageInput" accept="image/png,image/jpeg,image/webp" style="display:none">
    <input id="chatInput" placeholder="Type a message…" autocomplete="off">
    <button class="chatSendBtn" id="chatSendBtn" aria-label="Send">➤</button>
   </form>
  </div>
 </div>
</main>

<script>
/* Same backend and same localStorage keys as index.html's old widget, so
   a conversation started here is picked up if you ever open the site's
   chat badge, and vice versa. */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzKHLu21Y5oJeM7KQ5dcI3mTXpNnZlDRoTn19nCuqZ7SNb73S6cj9QaTY2Sd-QHTFoE/exec";
const POLL_MS = 5000;
const TYPING_POLL_MS = 2500;
// Photos are downscaled client-side before upload (see downscaleImage
// below) — this is just a client-side sanity cap so a huge original
// photo doesn't sit re-encoding forever; the backend enforces its own
// hard size/type/rate limits regardless of what the client sends.
const MAX_IMAGE_DIMENSION = 1280;

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }

let chatSessionId = localStorage.getItem("shopslipper-chat-id");
let chatInfo = JSON.parse(localStorage.getItem("shopslipper-chat-info")||"null");
let chatMessages = JSON.parse(localStorage.getItem("shopslipper-chat-msgs")||"[]");
let pollTimer = null;
let typingPollTimer = null;
let isStaffTypingNow = false;
let awaitingStaffMessage = false; // true = staff just stopped typing; keep dots on until the real message actually arrives
let awaitingTimeout = null;
let pendingImage = null; // {base64, mimeType, filename, dataUrl} staged but not yet sent

function ensureChatSession(){
 if(!chatSessionId){
  chatSessionId = "C"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase();
  localStorage.setItem("shopslipper-chat-id", chatSessionId);
 }
}
function showThread(){
 document.querySelector("#chatStartForm").style.display = "none";
 document.querySelector("#chatThreadWrap").style.display = "flex";
 renderChatMessages();
 fetchChatMessages();
 if(!pollTimer) pollTimer = setInterval(fetchChatMessages, POLL_MS);
 if(!typingPollTimer) typingPollTimer = setInterval(pollStaffTyping, TYPING_POLL_MS);
 document.querySelector("#chatInput").focus();
}
function init(){
 ensureChatSession();
 if(!chatInfo){
  document.querySelector("#chatStartForm").style.display = "block";
  document.querySelector("#chatThreadWrap").style.display = "none";
 }else{
  showThread();
 }
}
function startChatWithInfo(e){
 e.preventDefault();
 const form = new FormData(e.target);
 chatInfo = { name: form.get("name"), phone: form.get("phone") };
 localStorage.setItem("shopslipper-chat-info", JSON.stringify(chatInfo));
 showThread();
}
function renderChatMessages(){
 const el = document.querySelector("#chatMessages");
 if(!chatMessages.length && !isStaffTypingNow){
  el.innerHTML = `<div class="chatEmpty">Say hello! Our team will reply here shortly.</div>`;
 }else{
  let html = chatMessages.map(m=>{
   const cls = m.from==='staff' ? 'staff' : 'me';
   const imgPart = m.imageUrl ? `<img class="chatImg" src="${escapeHtml(m.imageUrl)}" onclick="openImageLightbox('${escapeHtml(m.imageUrl)}')" alt="photo">` : ``;
   const textPart = m.text ? `<span>${escapeHtml(m.text)}</span>` : ``;
   return `<div class="chatBubble ${cls}${m.imageUrl?' hasImg':''}">${imgPart}${textPart}<small>${m.time||""}</small></div>`;
  }).join("");
  if(isStaffTypingNow){
   html += `<div class="chatBubble staff typingDots"><span></span><span></span><span></span></div>`;
  }
  el.innerHTML = html;
 }
 el.scrollTop = el.scrollHeight;
}
function showChatError(msg){
 const el = document.querySelector("#chatErrMsg");
 el.textContent = msg;
 el.classList.add("show");
 clearTimeout(showChatError._t);
 showChatError._t = setTimeout(()=>el.classList.remove("show"), 4000);
}
async function sendChatMessage(e){
 e.preventDefault();
 const input = document.querySelector("#chatInput");
 const text = input.value.trim();
 if(!text && !pendingImage) return;
 input.value = "";
 const imageToSend = pendingImage;
 clearImagePreview();

 let imageUrl = "";
 if(imageToSend){
  const sendBtn = document.querySelector("#chatSendBtn");
  sendBtn.disabled = true;
  try{
   const res = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
    action:"uploadChatImage",
    sessionId: chatSessionId,
    data: imageToSend.base64,
    filename: imageToSend.filename,
    mimeType: imageToSend.mimeType
   })});
   const data = await res.json();
   if(data.error) throw new Error(data.error);
   imageUrl = data.url;
  }catch(err){
   sendBtn.disabled = false;
   showChatError(err.message || "Couldn't send that photo — please try again.");
   return;
  }
  sendBtn.disabled = false;
 }

 chatMessages.push({from:"customer", text, imageUrl, time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})});
 localStorage.setItem("shopslipper-chat-msgs", JSON.stringify(chatMessages));
 renderChatMessages();
 try{
  await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"sendChatMessage",sessionId:chatSessionId,name:chatInfo?.name||"",phone:chatInfo?.phone||"",message:text,imageUrl})});
 }catch(err){ /* stays visible locally; will sync on next poll */ }
}
async function fetchChatMessages(){
 if(!chatSessionId) return;
 try{
  const res = await fetch(`${SCRIPT_URL}?action=chatMessages&sessionId=${encodeURIComponent(chatSessionId)}`);
  const data = await res.json();
  if(data && Array.isArray(data.messages)){
   chatMessages = data.messages;
   localStorage.setItem("shopslipper-chat-msgs", JSON.stringify(chatMessages));
   // If we were holding the typing dots on because staff had just
   // stopped typing, this fetch is what finally clears them — the
   // dots stay up right through until the real reply lands, so
   // there's no gap where it looks like nothing happened.
   if(awaitingStaffMessage){
    awaitingStaffMessage = false;
    isStaffTypingNow = false;
    clearTimeout(awaitingTimeout);
   }
   renderChatMessages();
  }
 }catch(err){ /* backend unreachable — ignore, retry next poll */ }
}

/* ================== Photo attach: pick, downscale, preview ==================
   Selecting a file downscales it client-side (keeps the upload small
   and keeps it comfortably under the backend's size cap) and shows a
   thumbnail + cancel option — nothing is uploaded until the customer
   actually hits send, same as a normal messaging app.
================================================================= */
document.querySelector("#attachBtn").addEventListener("click", ()=>{
 document.querySelector("#chatImageInput").click();
});
document.querySelector("#chatImageInput").addEventListener("change", handleImageSelect);
document.querySelector("#imagePreviewCancel").addEventListener("click", clearImagePreview);

async function handleImageSelect(e){
 const file = e.target.files[0];
 e.target.value = ""; // reset so picking the exact same file again still fires change
 if(!file) return;
 if(!/^image\/(jpeg|png|webp)$/.test(file.type)){
  showChatError("Please choose a JPEG, PNG, or WebP photo.");
  return;
 }
 try{
  const { base64, mimeType, dataUrl } = await downscaleImage(file);
  pendingImage = { base64, mimeType, filename: file.name || "photo.jpg", dataUrl };
  document.querySelector("#imagePreviewThumb").src = dataUrl;
  document.querySelector("#imagePreviewName").textContent = pendingImage.filename;
  document.querySelector("#imagePreviewBar").style.display = "flex";
 }catch(err){
  showChatError("Couldn't read that photo — please try another.");
 }
}
function clearImagePreview(){
 pendingImage = null;
 document.querySelector("#imagePreviewBar").style.display = "none";
 document.querySelector("#imagePreviewThumb").src = "";
 document.querySelector("#imagePreviewName").textContent = "";
}
// Reads the file, draws it to a canvas capped at MAX_IMAGE_DIMENSION on
// its longest side, and re-encodes as JPEG — this is what keeps a
// phone's 4000px camera photo from ever coming close to the backend's
// upload cap.
function downscaleImage(file){
 return new Promise((resolve, reject)=>{
  const reader = new FileReader();
  reader.onerror = ()=> reject(new Error("Couldn't read file"));
  reader.onload = ()=>{
   const img = new Image();
   img.onerror = ()=> reject(new Error("Couldn't load image"));
   img.onload = ()=>{
    let w = img.width, h = img.height;
    if(w > MAX_IMAGE_DIMENSION || h > MAX_IMAGE_DIMENSION){
     const scale = MAX_IMAGE_DIMENSION / Math.max(w,h);
     w = Math.round(w*scale); h = Math.round(h*scale);
    }
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    const mimeType = "image/jpeg";
    const dataUrl = canvas.toDataURL(mimeType, 0.82);
    resolve({ base64: dataUrl.split(",")[1], mimeType, dataUrl });
   };
   img.src = reader.result;
  };
  reader.readAsDataURL(file);
 });
}
function openImageLightbox(url){
 const overlay = document.createElement("div");
 overlay.className = "imgLightbox";
 overlay.onclick = ()=> overlay.remove();
 const img = document.createElement("img");
 img.src = url;
 img.onclick = (ev)=> ev.stopPropagation();
 overlay.appendChild(img);
 document.body.appendChild(overlay);
}

/* ================== Typing indicator (both directions) ==================
   Outgoing: let staff know THIS customer is typing (existing behavior).
   Incoming: poll whether STAFF is typing back, and show animated dots
   for it — this is the actual "typing…" animation the customer sees.
========================================================================= */
let typingLastPing = 0;
function pingTyping(){
 if(!chatSessionId) return;
 const now = Date.now();
 if(now - typingLastPing < 2000) return;
 typingLastPing = now;
 fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"setTyping",sessionId:chatSessionId,name:chatInfo?.name||"",phone:chatInfo?.phone||""})}).catch(()=>{});
}
document.querySelector("#chatInput").addEventListener("input", pingTyping);

async function pollStaffTyping(){
 if(!chatSessionId) return;
 try{
  const res = await fetch(`${SCRIPT_URL}?action=staffTypingForSession&sessionId=${encodeURIComponent(chatSessionId)}`);
  const data = await res.json();
  const nowTyping = !!(data && data.typing);
  if(nowTyping){
   // Staff is actively typing — show dots right away.
   awaitingStaffMessage = false;
   clearTimeout(awaitingTimeout);
   if(!isStaffTypingNow){ isStaffTypingNow = true; renderChatMessages(); }
  }else if(isStaffTypingNow && !awaitingStaffMessage){
   // Staff just stopped typing (their reply is on its way). Keep the
   // dots showing and fetch immediately instead of waiting up to
   // POLL_MS for the next scheduled poll — fetchChatMessages() is what
   // actually turns the dots off, right when the real message shows up.
   awaitingStaffMessage = true;
   fetchChatMessages();
   // Safety net: if the message never arrives (send failed, etc.),
   // don't leave the dots up forever.
   clearTimeout(awaitingTimeout);
   awaitingTimeout = setTimeout(()=>{
    if(awaitingStaffMessage){
     awaitingStaffMessage = false;
     isStaffTypingNow = false;
     renderChatMessages();
    }
   }, 8000);
  }
 }catch(err){ /* silent — indicator just won't update this tick */ }
}

init();
</script>
</body>
</html>

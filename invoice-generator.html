<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopSlipper — Invoice Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.12.3/JsBarcode.all.min.js"></script>
<style>
  :root{
    --ink:#28394a;
    --paper:#eef5ee;
    --line:#d9e6de;
    --denim:#5b8fc7;
    --denim-dark:#3f6c9e;
    --thread:#e08a7d;
    --mustard:#8fc9a0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1000px 500px at 8% -10%, rgba(143,201,160,0.28), transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(91,143,199,0.22), transparent 55%),
      linear-gradient(160deg, #eef5ee 0%, #e3edf6 45%, #dbe8f4 100%);
    min-height:100vh;
  }
  .mono{ font-family:'JetBrains Mono',ui-monospace,monospace; }
  .wrap{ max-width:820px; margin:0 auto; padding:32px 20px 80px; }

  .brandbar{ display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .brandbar .mark{
    width:44px; height:44px; border-radius:50%; background:var(--denim); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:19px;
    overflow:hidden; flex-shrink:0;
  }
  .brandbar .mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brandbar h1{ font-family:'Anton',sans-serif; letter-spacing:.4px; font-size:20px; margin:0; }
  .brandbar .sub{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#6b7280; margin-top:1px; }

  .lookup{
    background:#fff; border:2px solid var(--ink); border-radius:16px; padding:20px;
    display:flex; gap:10px; flex-wrap:wrap; box-shadow:0 18px 34px -22px rgba(20,24,31,0.4);
  }
  .lookup input{
    flex:1; min-width:200px; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px;
    font-family:'JetBrains Mono',monospace; font-size:14px; background:var(--paper); text-transform:uppercase;
  }
  .lookup input:focus{ outline:2px solid var(--denim); border-color:var(--denim); }
  .lookup button{
    background:var(--denim); color:#fff; border:none; border-radius:10px; padding:12px 22px;
    font-weight:700; font-size:14px; cursor:pointer; transition:background .15s ease;
  }
  .lookup button:hover{ background:var(--denim-dark); }
  .lookup button:disabled{ background:#c7c7c7; cursor:not-allowed; }

  .status{ margin-top:14px; font-size:13.5px; }
  .status.error{ color:#b3453a; }
  .status.loading{ color:#6b7280; }

  .invoice{
    display:none; margin-top:28px; background:#fff; border:2px solid var(--ink); border-radius:18px;
    padding:36px 34px; box-shadow:0 30px 60px -30px rgba(20,24,31,0.4);
  }
  .invoice.show{ display:block; }

  .inv-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; border-bottom:2px dashed var(--ink); padding-bottom:22px; margin-bottom:22px; }
  .inv-head .from h2{ font-family:'Anton',sans-serif; font-size:24px; margin:0 0 4px; }
  .inv-head .from p{ margin:2px 0; font-size:12.5px; color:#6b7280; }
  .inv-head .meta{ text-align:right; }
  .inv-head .meta .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:1.2px; color:#6b7280; }
  .inv-head .meta .oid{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; margin:2px 0 10px; }
  .inv-head .meta .date{ font-size:12.5px; color:#4b5563; }

  .barcode-wrap{ text-align:right; margin-top:8px; height:44px; }
  .barcode-wrap svg{ max-width:220px; width:220px; height:44px; }

  .inv-parties{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:26px; }
  .inv-parties .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:1.2px; color:#6b7280; margin-bottom:6px; }
  .inv-parties h3{ margin:0 0 4px; font-size:15.5px; }
  .inv-parties p{ margin:2px 0; font-size:13px; color:#4b5563; line-height:1.5; }

  table.items{ width:100%; border-collapse:collapse; margin-bottom:22px; }
  table.items th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:#6b7280;
    border-bottom:2px solid var(--ink); padding:0 8px 10px 0;
  }
  table.items td{ font-size:13.5px; padding:12px 8px 12px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  table.items td.qty{ text-align:center; font-family:'JetBrains Mono',monospace; }
  table.items td.sku{ font-family:'JetBrains Mono',monospace; font-size:12px; color:#6b7280; }

  .inv-totals{ display:flex; justify-content:flex-end; margin-bottom:22px; }
  .inv-totals table{ min-width:260px; border-collapse:collapse; }
  .inv-totals td{ padding:6px 0; font-size:13.5px; }
  .inv-totals td:last-child{ text-align:right; font-family:'JetBrains Mono',monospace; }
  .inv-totals tr.total td{ font-size:17px; font-weight:700; border-top:2px solid var(--ink); padding-top:12px; }

  .inv-note{ background:var(--paper); border:1px dashed var(--denim); border-radius:10px; padding:12px 14px; font-size:13px; color:#4b5563; margin-bottom:24px; }
  .inv-note .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--denim-dark); margin-bottom:4px; }

  .inv-quote{
    text-align:center; font-style:italic; font-size:14px; color:var(--denim-dark); font-weight: 500;
    background:var(--paper); border-radius:10px; padding:16px 20px; margin-bottom:22px; line-height:1.5;
  }
  .inv-quote::before{ content:'“'; } .inv-quote::after{ content:'”'; }

  .inv-foot{ text-align:center; font-size:12px; color:#9ca3af; border-top:1px solid var(--line); padding-top:16px; }

  .actions{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .actions button{
    border:1.5px solid var(--ink); background:#fff; color:var(--ink); border-radius:999px; padding:11px 20px;
    font-weight:700; font-size:13.5px; cursor:pointer; transition:all .15s ease;
  }
  .actions button.primary{ background:var(--ink); color:#fff; }
  .actions button:hover{ background:var(--ink); color:#fff; }

  @media (max-width:640px){
    .inv-head{ flex-direction:column; }
    .inv-head .meta{ text-align:left; }
    .inv-parties{ grid-template-columns:1fr; }
    .invoice{ padding:24px 18px; }
  }

  @media print{
    @page{ size: 4in 6in; margin: 0.16in; }
    html, body{ background:#fff; }
    .brandbar, .lookup, .actions, .status{ display:none !important; }
    .wrap{ padding:0; max-width:none; margin:0; }

    .invoice{
      display:block !important; border:none; box-shadow:none; border-radius:0; padding:0;
      font-size:8px; line-height:1.35; width:100%;
    }

    .inv-head{
      flex-direction:column; align-items:flex-start; gap:6px;
      border-bottom:1.5px dashed var(--ink); padding-bottom:8px; margin-bottom:8px;
    }
    .inv-head .from h2{ font-size:14px; margin:0 0 2px; }
    .inv-head .from p{ font-size:7.5px; margin:1px 0; }
    .inv-head .meta{ text-align:left; width:100%; }
    .inv-head .meta .label{ font-size:7px; }
    .inv-head .meta .oid{ font-size:11px; margin:1px 0 2px; }
    .inv-head .meta .date{ font-size:7.5px; }
    .barcode-wrap{ margin-top:4px; height:22px; }
    .barcode-wrap svg{ max-width:150px; width:150px; height:22px; }

    .inv-parties{ grid-template-columns:1fr; gap:8px; margin-bottom:10px; }
    .inv-parties .label{ font-size:6.5px; margin-bottom:2px; }
    .inv-parties h3{ font-size:9.5px; margin:0 0 2px; }
    .inv-parties p{ font-size:7.5px; margin:1px 0; }

    table.items{ margin-bottom:10px; }
    table.items th{ font-size:6.5px; padding:0 3px 4px 0; }
    table.items td{ font-size:7.5px; padding:4px 3px 4px 0; }
    table.items td.sku{ font-size:6.5px; }

    .inv-totals{ margin-bottom:10px; }
    .inv-totals table{ min-width:0; width:100%; }
    .inv-totals td{ font-size:7.5px; padding:2px 0; }
    .inv-totals tr.total td{ font-size:10px; padding-top:6px; }

    .inv-note{ padding:6px 8px; font-size:7px; margin-bottom:10px; }
    .inv-note .label{ font-size:6.5px; }

    .inv-quote{ font-size:7.5px; padding:8px 10px; margin-bottom:8px; }

    .inv-foot{ font-size:6.5px; padding-top:8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <div class="mark"><img src="https://raw.githubusercontent.com/ShopSlipper/ShopSlipper/main/WhatsApp%20Image%202026-07-20%20at%202.17.32%20PM.jpeg" alt="ShopSlipper logo"></div>
    <div>
      <h1>ShopSlipper</h1>
      <div class="sub">Invoice Generator</div>
    </div>
  </div>

  <div class="lookup">
    <input type="text" id="orderIdInput" placeholder="Enter Order ID, e.g. SS7029074NP" autocomplete="off" />
    <button type="button" id="lookupBtn">Find Order</button>
  </div>
  <div class="status" id="statusMsg"></div>

  <div class="invoice" id="invoice">
    <div class="inv-head">
      <div class="from">
        <h2>ShopSlipper</h2>
        <p>Kathmandu Valley, Nepal</p>
        <p id="fromEmail"></p>
        <p id="fromPhone"></p>
      </div>
      <div class="meta">
        <div class="label">Invoice For Order</div>
        <div class="oid mono" id="invOrderId"></div>
        <div class="date" id="invDate"></div>
        <div class="barcode-wrap">
          <svg id="invBarcode" width="220" height="44"></svg>
        </div>
      </div>
    </div>

    <div class="inv-parties">
      <div>
        <div class="label">Billed To</div>
        <h3 id="custName"></h3>
        <p id="custPhone"></p>
        <p id="custEmail"></p>
      </div>
      <div>
        <div class="label">Delivery Address</div>
        <p id="custAddress"></p>
      </div>
    </div>

    <table class="items">
      <thead>
        <tr>
          <th>Item</th>
          <th>Options</th>
          <th class="sku">SKU</th>
          <th style="text-align:center;">Qty</th>
        </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>

    <div class="inv-totals">
      <table>
        <tr><td>Subtotal</td><td id="tSubtotal">—</td></tr>
        <tr><td>Delivery</td><td id="tDelivery">—</td></tr>
        <tr class="total"><td>Total (Cash on Delivery)</td><td id="tTotal">—</td></tr>
      </table>
    </div>

    <div class="inv-note" id="noteBlock" style="display:none;">
      <div class="label">Order Note</div>
      <div id="noteText"></div>
    </div>

    <div class="inv-quote" id="invQuote"></div>

    <div class="inv-foot">Thank you for shopping with ShopSlipper — Kathmandu Valley Delivery.</div>
  </div>

  <div class="actions" id="actions" style="display:none;">
    <button type="button" class="primary" id="printBtn">🖨️ Print / Save as PDF</button>
    <button type="button" id="newSearchBtn">New Search</button>
  </div>
</div>

<script>
const ORDERS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSclnzIDnbWJ9KhDFUrA-cNDsUhIte3Np20P288ZwiannuwCtB34BDNSw5LMvpD_nTAgzG9IezAfiju/pub?gid=78980778&single=true&output=csv";
const CONFIG = {
  currency: "Rs",
  email: "www.shopslipper@gmail.com",
  phone: "+9779747961784"
};

// Paste the Web App URL you got from Apps Script deployment here:
const STATUS_UPDATE_URL = "https://script.google.com/macros/s/AKfycbwlpeLl_caJdrbbJa84qUCf3LRrs6hSkqBouLwrknCev4b6AtXZo_gEyIdG9YYDXJXd/exec";

// Beautiful personalized quotes array
const QUOTES = [
  "{name}, thank you for trusting us with something as personal as comfort. We hope this becomes a small part of your everyday peace.",
  "After a long day, may these slippers remind you, {name}, that you deserve softness too. Welcome home, every single day.",
  "{name}, we don't just deliver a product — we hope we're delivering a little rest for your tired feet and a calmer mind.",
  "There is quiet comfort in caring for yourself, {name}. We're grateful to be part of that in some small way.",
  "{name}, may this pair carry you gently through busy days and bring you home to comfort each night.",
  "We noticed you, {name} — not just as an order, but as someone who deserves a little more ease in their day. Thank you.",
  "{name}, self-care often hides in small things like this. We hope every step reminds you that you matter.",
  "Thank you for choosing us, {name}. We hope this small comfort finds its way into your everyday happiness."
];

document.getElementById('fromEmail').textContent = "📧 " + CONFIG.email;
document.getElementById('fromPhone').textContent = "📱 " + CONFIG.phone;

function parseCsv(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n' || c === '\r'){
        if (c === '\r' && next === '\n') continue;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function csvToOrders(text){
  const rows = parseCsv(text);
  if (!rows.length) return [];

  const header = rows[0].map(h => h.trim().toLowerCase().replace(/[^a-z0-9]/g, ''));

  return rows.slice(1).filter(r => r.length > 1 || r[0]).map(r => {
    const obj = {};
    header.forEach((h,i) => obj[h] = (r[i] || "").trim());
    return {
      timestamp: obj['timestamp'] || obj['date'] || "",
      orderId: obj['orderid'] || obj['order'] || obj['id'] || "",
      name: obj['customername'] || obj['name'] || "",
      phone: obj['phone'] || obj['phonenumber'] || "",
      address: obj['address'] || obj['deliveryaddress'] || "",
      email: obj['email'] || obj['emailaddress'] || "",
      items: obj['items'] || obj['products'] || "",
      subtotal: obj['subtotal'] || "",
      delivery: obj['deliveryfee'] || obj['delivery'] || obj['shipping'] || "",
      total: obj['total'] || obj['totalamount'] || "",
      note: obj['note'] || obj['notes'] || "",
      skus: obj['skus'] || ""
    };
  });
}

function parseItemsString(itemsStr){
  if (!itemsStr) return [];
  const items = [];
  const re = /([^,[]+?)\s*\[SKU:\s*([^\]]+)\]\s*\[([^\]]+)\]\s*\(x(\d+)\)/g;
  let m;
  while ((m = re.exec(itemsStr)) !== null){
    items.push({
      name: m[1].replace(/^,\s*/, '').trim(),
      sku: m[2].trim(),
      options: m[3].trim(),
      qty: m[4]
    });
  }
  if (!items.length && itemsStr.trim()){
    items.push({ name: itemsStr.trim(), sku: "—", options: "—", qty: "—" });
  }
  return items;
}

function escapeHtml(str){
  return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function formatMoney(v){
  if (!v) return "—";
  const strVal = String(v).replace(/[^0-9.]/g, ''); 
  const n = Number(strVal);
  return CONFIG.currency + " " + (isNaN(n) ? (v || "0") : n.toLocaleString());
}

// Generates a personalized quote based on the customer's name
function generatePersonalizedQuote(fullName) {
  // Extract just the first name (e.g., "John Doe" -> "John")
  const firstName = (fullName || "Friend").trim().split(' ')[0];
  
  // Use the characters in their name to pick a quote consistently
  let charSum = 0;
  for (let i = 0; i < firstName.length; i++) {
    charSum += firstName.charCodeAt(i);
  }
  
  const quoteIndex = charSum % QUOTES.length;
  // Replace {name} placeholder with their actual first name
  return QUOTES[quoteIndex].replace('{name}', firstName);
}

function renderInvoice(order){
  document.getElementById('invOrderId').textContent = order.orderId || "—";
  document.getElementById('invDate').textContent = order.timestamp || "—";
  document.getElementById('custName').textContent = order.name || "—";
  document.getElementById('custPhone').textContent = "📱 " + (order.phone || "—");
  document.getElementById('custEmail').textContent = "📧 " + (order.email || "—");
  document.getElementById('custAddress').textContent = order.address || "—";

  const items = parseItemsString(order.items);
  document.getElementById('itemsBody').innerHTML = items.map(it => `
    <tr>
      <td>${escapeHtml(it.name)}</td>
      <td>${escapeHtml(it.options)}</td>
      <td class="sku">${escapeHtml(it.sku)}</td>
      <td class="qty">${escapeHtml(it.qty)}</td>
    </tr>
  `).join('');

  document.getElementById('tSubtotal').textContent = formatMoney(order.subtotal);
  document.getElementById('tDelivery').textContent = formatMoney(order.delivery);
  document.getElementById('tTotal').textContent = formatMoney(order.total);

  const noteBlock = document.getElementById('noteBlock');
  if (order.note && order.note.trim()){
    document.getElementById('noteText').textContent = order.note;
    noteBlock.style.display = 'block';
  } else {
    noteBlock.style.display = 'none';
  }

  // Inject the personalized quote
  document.getElementById('invQuote').textContent = generatePersonalizedQuote(order.name);

  // Render scannable barcode for the order ID
  const barcodeWrap = document.querySelector('.barcode-wrap');
  if (order.orderId && window.JsBarcode){
    try{
      JsBarcode("#invBarcode", order.orderId, {
        format: "CODE128",
        displayValue: false,
        margin: 0,
        height: 40,
        width: 1.6
      });
      barcodeWrap.style.display = '';
    } catch(e){
      console.error('Barcode render failed', e);
      barcodeWrap.style.display = 'none';
    }
  } else {
    barcodeWrap.style.display = 'none';
  }

  document.getElementById('invoice').classList.add('show');
  document.getElementById('actions').style.display = 'flex';
}

function setStatus(msg, type){
  const el = document.getElementById('statusMsg');
  el.textContent = msg || '';
  el.className = 'status' + (type ? ' ' + type : '');
}

let currentOrderData = null;

async function markOrderProcessing(order){
  if (!STATUS_UPDATE_URL || STATUS_UPDATE_URL.indexOf('PASTE_YOUR') === 0){
    console.warn('STATUS_UPDATE_URL not configured — skipping status update.');
    return;
  }
  try{
    await fetch(STATUS_UPDATE_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script web apps don't return readable CORS headers by default
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        orderId: order.orderId,
        action: 'processing',
        name: order.name,
        phone: order.phone,
        address: order.address,
        email: order.email,
        items: order.items,
        total: order.total
      })
    });
  } catch(err){
    console.error('Failed to update order status:', err);
  }
}

async function lookupOrder(){
  const rawInput = document.getElementById('orderIdInput').value;
  const targetId = rawInput.replace(/\s+/g, '').toLowerCase(); 
  
  if (!targetId){
    setStatus('Please enter an Order ID.', 'error');
    return;
  }
  const btn = document.getElementById('lookupBtn');
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Searching...';
  setStatus('Fetching order data…', 'loading');
  document.getElementById('invoice').classList.remove('show');
  document.getElementById('actions').style.display = 'none';

  try {
    const res = await fetch(ORDERS_CSV_URL + (ORDERS_CSV_URL.includes('?') ? '&' : '?') + '_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const orders = csvToOrders(text);
    
    const match = orders.find(o => o.orderId.replace(/\s+/g, '').toLowerCase() === targetId);
    
    if (!match){
      setStatus(`No order found matching "${rawInput}". Check the ID and try again. (Note: Google Sheets can take 3-5 mins to publish new orders)`, 'error');
      return;
    }
    renderInvoice(match);
    currentOrderData = match;
    setStatus('');
  } catch (err){
    console.error(err);
    setStatus('Could not load order data right now — please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

document.getElementById('lookupBtn').addEventListener('click', lookupOrder);
document.getElementById('orderIdInput').addEventListener('keydown', (e)=>{
  if (e.key === 'Enter'){ e.preventDefault(); lookupOrder(); }
});
document.getElementById('printBtn').addEventListener('click', ()=>{
  if (currentOrderData){
    markOrderProcessing(currentOrderData);
  }
  window.print();
});
document.getElementById('newSearchBtn').addEventListener('click', ()=>{
  document.getElementById('orderIdInput').value = '';
  document.getElementById('orderIdInput').focus();
  document.getElementById('invoice').classList.remove('show');
  document.getElementById('actions').style.display = 'none';
  setStatus('');
  currentOrderData = null;
});

// Auto-focus the search box so a barcode scanner (which types the code
// then sends Enter) can scan straight into the lookup without clicking.
document.getElementById('orderIdInput').focus();
document.addEventListener('click', (e)=>{
  // Re-focus after clicks elsewhere on the page, but not when the user
  // is deliberately clicking inside another input/button.
  const tag = e.target.tagName;
  if (tag !== 'INPUT' && tag !== 'BUTTON'){
    document.getElementById('orderIdInput').focus();
  }
});

const params = new URLSearchParams(window.location.search);
const preId = params.get('order');
if (preId){
  document.getElementById('orderIdInput').value = preId;
  lookupOrder();
}
</script>
</body>
</html>

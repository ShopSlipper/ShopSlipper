<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopSlipper — Order History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#28394a;
    --paper:#eef5ee;
    --line:#d9e6de;
    --denim:#5b8fc7;
    --denim-dark:#3f6c9e;
    --green:#4caf7d;
    --green-dark:#379764;
    --red:#e0655b;
    --red-dark:#c94a40;
    --amber:#d9a441;
    --amber-dark:#b5822d;
    --grey:#8a94a3;
    --grey-dark:#5f6b7a;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1000px 500px at 8% -10%, rgba(143,201,160,0.28), transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(91,143,199,0.22), transparent 55%),
      linear-gradient(160deg, #eef5ee 0%, #e3edf6 45%, #dbe8f4 100%);
    min-height:100vh;
  }
  .mono{ font-family:'JetBrains Mono',ui-monospace,monospace; }
  .wrap{ max-width:720px; margin:0 auto; padding:32px 20px 80px; }

  .brandbar{ display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .brandbar .mark{
    width:44px; height:44px; border-radius:50%; background:var(--denim); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:19px;
    overflow:hidden; flex-shrink:0;
  }
  .brandbar .mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brandbar h1{ font-family:'Anton',sans-serif; letter-spacing:.4px; font-size:20px; margin:0; }
  .brandbar .sub{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#6b7280; margin-top:1px; }

  .lookup{
    background:#fff; border:2px solid var(--ink); border-radius:16px; padding:20px;
    display:flex; gap:10px; flex-wrap:wrap; box-shadow:0 18px 34px -22px rgba(20,24,31,0.4);
  }
  .lookup input{
    flex:1; min-width:200px; border:1.5px solid var(--line); border-radius:10px; padding:14px 16px;
    font-family:'JetBrains Mono',monospace; font-size:15px; background:var(--paper);
  }
  .lookup input:focus{ outline:2px solid var(--denim); border-color:var(--denim); }
  .lookup button{
    background:var(--denim); color:#fff; border:none; border-radius:10px; padding:14px 24px;
    font-weight:700; font-size:14px; cursor:pointer; transition:background .15s ease;
  }
  .lookup button:hover{ background:var(--denim-dark); }
  .lookup button:disabled{ background:#c7c7c7; cursor:not-allowed; }
  .lookup button#clearBtn{
    background:#fff; color:var(--ink); border:1.5px solid var(--ink);
  }
  .lookup button#clearBtn:hover{ background:var(--ink); color:#fff; }

  .status{ margin-top:14px; font-size:13.5px; }
  .status.error{ color:#b3453a; }
  .status.loading{ color:#6b7280; }
  .status.success{ color:var(--green-dark); font-weight:600; }

  .summary{
    display:none; margin-top:24px; background:#fff; border:2px solid var(--ink); border-radius:16px;
    padding:20px 22px; box-shadow:0 18px 34px -22px rgba(20,24,31,0.4);
  }
  .summary.show{ display:block; }
  .summary h2{ font-size:18px; margin:0 0 4px; }
  .summary .sub-line{ font-size:13px; color:#6b7280; margin:2px 0; }
  .summary .stats{ display:flex; gap:20px; margin-top:14px; flex-wrap:wrap; }
  .summary .stat{ }
  .summary .stat .num{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px; }
  .summary .stat .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:#6b7280; }

  .order-list{ margin-top:20px; }
  .order-card{
    background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:16px 18px;
    margin-bottom:12px; cursor:pointer; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .order-card:hover{ border-color:var(--denim); box-shadow:0 12px 26px -20px rgba(20,24,31,0.5); }
  .order-card.expanded{ border-color:var(--denim); }
  .oc-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .oc-oid{ font-weight:700; font-size:15px; }
  .oc-date{ font-size:11.5px; color:#9ca3af; }
  .oc-summary{ font-size:13.5px; color:#4b5563; margin-top:6px; }
  .oc-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; flex-wrap:wrap; gap:8px; }
  .oc-total{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14.5px; }
  .oc-tags{ display:flex; gap:6px; flex-wrap:wrap; }

  .tag{
    display:inline-block; padding:4px 10px; border-radius:999px;
    font-size:11.5px; font-weight:700; letter-spacing:.2px;
  }
  .tag.handover{ background:#e2f4ea; color:var(--green-dark); }
  .tag.failed{ background:#fbe4e2; color:var(--red-dark); }
  .tag.cancelled{ background:#e9ebef; color:var(--grey-dark); }
  .tag.processing{ background:#fdf1dc; color:var(--amber-dark); }
  .tag.pending{ background:#eef2f6; color:#6b7280; }

  .oc-detail{
    display:none; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);
  }
  .oc-detail.show{ display:block; }
  .oc-detail .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:#6b7280; margin-bottom:6px; }
  .oc-detail p{ margin:2px 0; font-size:13.5px; color:#4b5563; }

  table.items{ width:100%; border-collapse:collapse; margin-top:8px; }
  table.items th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:#6b7280;
    border-bottom:1.5px solid var(--ink); padding:0 6px 6px 0;
  }
  table.items td{ font-size:13px; padding:7px 6px 7px 0; border-bottom:1px solid var(--line); }
  table.items td.qty{ text-align:center; font-family:'JetBrains Mono',monospace; }

  .empty-hint{ text-align:center; margin-top:40px; color:#9ca3af; font-size:13.5px; }

  .cancel-btn{
    margin-top:14px; background:#fff; color:var(--red-dark); border:1.5px solid var(--red-dark);
    border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .cancel-btn:hover:not(:disabled){ background:var(--red-dark); color:#fff; }
  .cancel-btn:disabled{ opacity:.6; cursor:not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <div class="mark"><img src="https://raw.githubusercontent.com/ShopSlipper/ShopSlipper/main/WhatsApp%20Image%202026-07-20%20at%202.17.32%20PM.jpeg" alt="ShopSlipper logo"></div>
    <div>
      <h1>ShopSlipper</h1>
      <div class="sub">Order History Lookup</div>
    </div>
  </div>

  <div class="lookup">
    <input type="text" id="searchInput" placeholder="Enter phone number or email address" autocomplete="off" />
    <button type="button" id="searchBtn">Search</button>
    <button type="button" id="clearBtn">Clear</button>
  </div>
  <div class="status" id="statusMsg"></div>

  <div class="summary" id="summary">
    <h2 id="sumName"></h2>
    <div class="sub-line" id="sumPhone"></div>
    <div class="sub-line" id="sumEmail"></div>
    <div class="stats">
      <div class="stat"><div class="num" id="sumCount">0</div><div class="lbl">Orders</div></div>
      <div class="stat"><div class="num" id="sumTotal">—</div><div class="lbl">Total Spent</div></div>
    </div>
  </div>

  <div class="order-list" id="orderList"></div>
  <div class="empty-hint" id="emptyHint" style="display:none;">No orders found for that phone number or email.</div>
</div>

<script>
const ORDERS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRhZzq7pSJWpA6PUs_K2UVL0lAQn78542JABRaLoZdgUfD6jr_IO_OuDDs4Ts9Lx4Pe0gQvjeO2vwGS/pub?gid=281007740&single=true&output=csv";
const STATUS_UPDATE_URL = "https://script.google.com/macros/s/AKfycbzb41GKorM_F6MMqUmdK9rLc5NMMvY3o2BD6hcBXhiod93Ub2CRHijI5T3gWisjIsP1/exec";
const CONFIG = { currency: "Rs" };

function parseCsv(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n' || c === '\r'){
        if (c === '\r' && next === '\n') continue;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function csvToOrders(text){
  const rows = parseCsv(text);
  if (!rows.length) return [];
  const header = rows[0].map(h => h.trim().toLowerCase().replace(/[^a-z0-9]/g, ''));
  return rows.slice(1).filter(r => r.length > 1 || r[0]).map(r => {
    const obj = {};
    header.forEach((h,i) => obj[h] = (r[i] || "").trim());
    return {
      timestamp: obj['timestamp'] || obj['date'] || "",
      orderId: obj['orderid'] || obj['order'] || obj['id'] || "",
      name: obj['customername'] || obj['name'] || "",
      phone: obj['phone'] || obj['phonenumber'] || "",
      address: obj['address'] || obj['deliveryaddress'] || "",
      email: obj['email'] || obj['emailaddress'] || "",
      items: obj['items'] || obj['products'] || "",
      total: obj['total'] || obj['totalamount'] || "",
      note: obj['note'] || obj['notes'] || "",
      status: obj['status'] || "",
      deliveryStatus: obj['deliverystatus'] || ""
    };
  });
}

function parseItemsString(itemsStr){
  if (!itemsStr) return [];
  const items = [];
  const re = /([^,[]+?)\s*\[SKU:\s*([^\]]+)\]\s*\[([^\]]+)\]\s*\(x(\d+)\)/g;
  let m;
  while ((m = re.exec(itemsStr)) !== null){
    items.push({ name: m[1].replace(/^,\s*/, '').trim(), sku: m[2].trim(), options: m[3].trim(), qty: m[4] });
  }
  if (!items.length && itemsStr.trim()){
    items.push({ name: itemsStr.trim(), sku: "—", options: "—", qty: "—" });
  }
  return items;
}

function escapeHtml(str){
  return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function formatMoney(v){
  if (!v) return "—";
  const strVal = String(v).replace(/[^0-9.]/g, '');
  const n = Number(strVal);
  return CONFIG.currency + " " + (isNaN(n) ? (v || "0") : n.toLocaleString());
}

function setStatus(msg, type){
  const el = document.getElementById('statusMsg');
  el.textContent = msg || '';
  el.className = 'status' + (type ? ' ' + type : '');
}

/**
 * Priority-based single status tag:
 *   1) Delivery Status = "Handover"  -> Handover
 *   2) Delivery Status = "Cancelled" -> Cancelled (customer/order cancelled)
 *   3) Delivery Status = "Failed"    -> Failed (delivery attempt failed)
 *   4) Status = "Processing" (and no delivery status yet) -> Processing
 *   5) Nothing set -> Pending
 */
function statusTags(order){
  const ds = (order.deliveryStatus || '').trim().toLowerCase();
  const st = (order.status || '').trim().toLowerCase();

  if (ds === 'handover'){
    return `<span class="tag handover">Handover</span>`;
  }
  if (ds === 'cancelled' || ds === 'canceled'){
    return `<span class="tag cancelled">Cancelled</span>`;
  }
  if (ds === 'failed'){
    return `<span class="tag failed">Failed</span>`;
  }
  if (st === 'processing'){
    return `<span class="tag processing">Processing</span>`;
  }
  return `<span class="tag pending">Pending</span>`;
}

function canCancel(order){
  const ds = (order.deliveryStatus || '').trim().toLowerCase();
  return ds !== 'handover' && ds !== 'cancelled' && ds !== 'canceled';
}

let currentOrders = [];

function renderResults(matches){
  const listEl = document.getElementById('orderList');
  const emptyHint = document.getElementById('emptyHint');
  const summary = document.getElementById('summary');

  if (!matches.length){
    listEl.innerHTML = '';
    summary.classList.remove('show');
    emptyHint.style.display = 'block';
    return;
  }
  emptyHint.style.display = 'none';

  // Sort newest first when timestamps look sortable
  const sorted = matches.slice().sort((a,b) => {
    const da = new Date(a.timestamp), db = new Date(b.timestamp);
    if (!isNaN(da) && !isNaN(db)) return db - da;
    return 0;
  });

  const custName = sorted.find(o => o.name)?.name || 'Customer';
  const custPhone = sorted.find(o => o.phone)?.phone || '—';
  const custEmail = sorted.find(o => o.email)?.email || '—';
  const totalSpent = sorted.reduce((sum, o) => {
    const ds = (o.deliveryStatus || '').trim().toLowerCase();
    if (ds === 'cancelled' || ds === 'canceled' || ds === 'failed') return sum;
    const n = Number(String(o.total).replace(/[^0-9.]/g, ''));
    return sum + (isNaN(n) ? 0 : n);
  }, 0);

  document.getElementById('sumName').textContent = custName;
  document.getElementById('sumPhone').textContent = "📱 " + custPhone;
  document.getElementById('sumEmail').textContent = custEmail !== '—' ? "📧 " + custEmail : '';
  document.getElementById('sumCount').textContent = sorted.length;
  document.getElementById('sumTotal').textContent = CONFIG.currency + " " + totalSpent.toLocaleString();
  summary.classList.add('show');

  currentOrders = sorted;

  listEl.innerHTML = sorted.map((o, idx) => {
    const itemsSummary = parseItemsString(o.items).map(it => `${it.name} x${it.qty}`).join(', ');
    return `
      <div class="order-card" data-idx="${idx}">
        <div class="oc-top">
          <span class="oc-oid mono">${escapeHtml(o.orderId)}</span>
          <span class="oc-date">${escapeHtml(o.timestamp)}</span>
        </div>
        <div class="oc-summary">${escapeHtml(itemsSummary || 'No items listed')}</div>
        <div class="oc-bottom">
          <span class="oc-total">${formatMoney(o.total)}</span>
          <div class="oc-tags">${statusTags(o)}</div>
        </div>
        <div class="oc-detail" id="detail-${idx}">
          <div class="label">Delivery Address</div>
          <p>${escapeHtml(o.address || '—')}</p>
          ${o.note ? `<div class="label">Note</div><p>${escapeHtml(o.note)}</p>` : ''}
          <div class="label">Items</div>
          <table class="items">
            <thead><tr><th>Item</th><th>Options</th><th class="qty">Qty</th></tr></thead>
            <tbody>
              ${parseItemsString(o.items).map(it => `
                <tr><td>${escapeHtml(it.name)}</td><td>${escapeHtml(it.options)}</td><td class="qty">${escapeHtml(it.qty)}</td></tr>
              `).join('')}
            </tbody>
          </table>
          ${canCancel(o) ? `<button type="button" class="cancel-btn" data-cancel-idx="${idx}">Cancel Order</button>` : ''}
        </div>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.cancel-btn').forEach(btn => {
    btn.addEventListener('click', (evt) => {
      evt.stopPropagation();
      const idx = btn.getAttribute('data-cancel-idx');
      handleCancelOrder(idx, btn);
    });
  });

  listEl.querySelectorAll('.order-card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = card.getAttribute('data-idx');
      const detail = document.getElementById('detail-' + idx);
      const isOpen = detail.classList.contains('show');
      // Close any other open detail
      listEl.querySelectorAll('.oc-detail.show').forEach(d => d.classList.remove('show'));
      listEl.querySelectorAll('.order-card.expanded').forEach(c => c.classList.remove('expanded'));
      if (!isOpen){
        detail.classList.add('show');
        card.classList.add('expanded');
      }
    });
  });
}

async function handleCancelOrder(idx, btn){
  const order = currentOrders[idx];
  if (!order) return;

  const confirmed = confirm(`Cancel order ${order.orderId}? This will mark it as Cancelled and cannot be undone from here.`);
  if (!confirmed) return;

  btn.disabled = true;
  btn.textContent = 'Cancelling…';

  try {
    const res = await fetch(STATUS_UPDATE_URL, {
      method: 'POST',
      body: JSON.stringify({
        orderId: order.orderId,
        status: 'Cancelled',
        field: 'Delivery Status',
        timeField: 'Delivery Status Time'
      })
    });
    const result = await res.json();

    if (result.success){
      order.deliveryStatus = 'Cancelled';
      setStatus(`Order ${order.orderId} cancelled.`, 'success');
      renderResults(currentOrders);
    } else {
      btn.disabled = false;
      btn.textContent = 'Cancel Order';
      setStatus('Could not cancel: ' + (result.error || 'unknown error'), 'error');
    }
  } catch (err){
    console.error(err);
    btn.disabled = false;
    btn.textContent = 'Cancel Order';
    setStatus('Could not reach server — please try again.', 'error');
  }
}

async function searchCustomer(){
  const rawInput = document.getElementById('searchInput').value.trim();
  if (!rawInput){
    setStatus('Enter a phone number or email to search.', 'error');
    return;
  }

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  setStatus('Searching…', 'loading');
  document.getElementById('summary').classList.remove('show');
  document.getElementById('orderList').innerHTML = '';
  document.getElementById('emptyHint').style.display = 'none';

  try {
    const res = await fetch(ORDERS_CSV_URL + (ORDERS_CSV_URL.includes('?') ? '&' : '?') + '_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const orders = csvToOrders(text);

    const digitsOnly = rawInput.replace(/[^0-9]/g, '');
    const isEmailish = rawInput.includes('@');
    let matches = [];

    if (isEmailish){
      matches = orders.filter(o => o.email && o.email.toLowerCase().includes(rawInput.toLowerCase()));
    } else if (digitsOnly.length >= 4){
      matches = orders.filter(o => o.phone && o.phone.replace(/[^0-9]/g, '').includes(digitsOnly));
    } else {
      setStatus('Enter at least 4 digits of a phone number, or a valid email.', 'error');
      btn.disabled = false;
      return;
    }

    renderResults(matches);
    setStatus(matches.length ? `${matches.length} order${matches.length > 1 ? 's' : ''} found.` : '', matches.length ? 'success' : '');
  } catch (err){
    console.error(err);
    setStatus('Could not load order data — please try again.', 'error');
  } finally {
    btn.disabled = false;
  }
}

function clearSearch(){
  document.getElementById('searchInput').value = '';
  document.getElementById('summary').classList.remove('show');
  document.getElementById('orderList').innerHTML = '';
  document.getElementById('emptyHint').style.display = 'none';
  setStatus('');
  document.getElementById('searchInput').focus();
}

document.getElementById('searchBtn').addEventListener('click', searchCustomer);
document.getElementById('clearBtn').addEventListener('click', clearSearch);
document.getElementById('searchInput').addEventListener('keydown', (e)=>{
  if (e.key === 'Enter'){ e.preventDefault(); searchCustomer(); }
});
document.getElementById('searchInput').focus();
</script>
</body>
</html>
